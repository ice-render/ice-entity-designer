<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>IED-entity-relations</title>
  <body>
    <div>
      <button id="btn-schema">输出 Schema</button>
      <button id="btn-zoom-in">放大</button>
      <button id="btn-zoom-out">缩小</button>
      <button id="btn-reset">重置视图</button>
      <pre id="schema-output" style="max-height: 160px; overflow: auto; background: #0f172a; color: #e2e8f0; padding: 8px;"></pre>
      <script src="../node_modules/ice-render/dist/index.umd.js"></script>
      <script src="../dist/index.umd.js"></script>
    </div>
    <br />
    <canvas id="canvas-1" width="1500" height="1000" style="background-color: #f8fafc; cursor: grab;"></canvas>
  </body>
  <script type="text/javascript">
    const ice = new ICE.ICE().init('canvas-1');
    window.__ice = ice;
    ice.alignmentGuide.enable({ threshold: 6 });

    const canvasEl = document.getElementById('canvas-1');
    function zoomAtClientPoint(clientX, clientY, factor) {
      const oldScale = ice.viewport.scale;
      const nextScale = Math.max(0.3, Math.min(3, oldScale * factor));
      const rect = canvasEl.getBoundingClientRect();
      const cx = clientX - rect.left;
      const cy = clientY - rect.top;
      const tx = cx - ((cx - ice.viewport.tx) * nextScale) / oldScale;
      const ty = cy - ((cy - ice.viewport.ty) * nextScale) / oldScale;
      ice.setViewport(nextScale, tx, ty);
    }
    canvasEl.addEventListener('wheel', (evt) => {
      evt.preventDefault();
      zoomAtClientPoint(evt.clientX, evt.clientY, evt.deltaY > 0 ? 0.9 : 1.1);
    });

    // E-R 场景默认允许拖拽画布：左键在空白处拖拽，中键则始终拖拽；命中图元时仍交给组件拖动逻辑。
    let panning = false;
    let lastX = 0;
    let lastY = 0;
    canvasEl.addEventListener('mousedown', (evt) => {
      const blank = evt.button === 0 && !ice.hitTest(evt.offsetX, evt.offsetY);
      if (evt.button !== 1 && !blank) return;
      evt.preventDefault();
      evt.stopPropagation();
      panning = true;
      lastX = evt.offsetX;
      lastY = evt.offsetY;
      canvasEl.style.cursor = 'grabbing';
    });
    canvasEl.addEventListener('mousemove', (evt) => {
      if (!panning) return;
      const dx = evt.offsetX - lastX;
      const dy = evt.offsetY - lastY;
      lastX = evt.offsetX;
      lastY = evt.offsetY;
      ice.setViewport(ice.viewport.scale, ice.viewport.tx + dx, ice.viewport.ty + dy);
    });
    canvasEl.addEventListener('mouseup', () => {
      panning = false;
      canvasEl.style.cursor = 'grab';
    });
    canvasEl.addEventListener('mouseleave', () => {
      panning = false;
      canvasEl.style.cursor = 'grab';
    });
    canvasEl.addEventListener('auxclick', (evt) => {
      if (evt.button === 1) evt.preventDefault();
    });
    document.querySelector('#btn-zoom-in').addEventListener('click', () => {
      zoomAtClientPoint(canvasEl.getBoundingClientRect().left + canvasEl.width / 2, canvasEl.getBoundingClientRect().top + canvasEl.height / 2, 1.15);
    });
    document.querySelector('#btn-zoom-out').addEventListener('click', () => {
      zoomAtClientPoint(canvasEl.getBoundingClientRect().left + canvasEl.width / 2, canvasEl.getBoundingClientRect().top + canvasEl.height / 2, 0.85);
    });
    document.querySelector('#btn-reset').addEventListener('click', () => {
      ice.setViewport(1, 0, 0);
    });
    document.querySelector('#btn-schema').addEventListener('click', () => {
      const schema = IED.toSchemaObject(ice.childNodes);
      document.querySelector('#schema-output').textContent = JSON.stringify(schema, null, 2);
    });

    const idField = {
      name: 'id',
      type: 'number',
      length: 64,
      primary: true,
      autoIncrement: true,
      nullable: false,
    };

    function makeEntity(props) {
      const entity = new IED.Entity({
        style: {
          fillStyle: '#ffffff',
          strokeStyle: '#94a3b8',
          radius: 10,
          lineWidth: 1.5,
        },
        headerStyle: {
          textColor: '#0f766e',
          fontSize: 18,
        },
        fieldStyle: {
          textColor: '#334155',
          fontSize: 15,
        },
        dividerStyle: {
          strokeStyle: '#e2e8f0',
        },
        ...props,
      });
      ice.addChild(entity);
      return entity;
    }

    const customer = makeEntity({
      left: 80,
      top: 120,
      entityName: 'Customer',
      fields: [
        idField,
        { name: 'name', type: 'string', length: 128, nullable: false },
        { name: 'email', type: 'string', length: 128, unique: true, nullable: false },
        { name: 'phone', type: 'string', length: 32, nullable: true, comment: '联系电话，可空' },
      ],
    });

    const order = makeEntity({
      left: 430,
      top: 100,
      entityName: 'Order',
      fields: [
        idField,
        { name: 'orderNo', type: 'string', length: 64, unique: true, nullable: false },
        { name: 'customerId', type: 'number', length: 64, foreignKey: true, nullable: false, index: true },
        { name: 'totalAmount', type: 'decimal', length: '12,2', nullable: false, default: '0.00' },
        { name: 'status', type: 'string', length: 32, nullable: false, default: "'created'" },
      ],
    });

    const orderItem = makeEntity({
      left: 800,
      top: 90,
      entityName: 'OrderItem',
      fields: [
        idField,
        { name: 'orderId', type: 'number', length: 64, foreignKey: true, nullable: false, index: true },
        { name: 'productId', type: 'number', length: 64, foreignKey: true, nullable: false, index: true },
        { name: 'quantity', type: 'number', length: 11, nullable: false },
        { name: 'unitPrice', type: 'decimal', length: '12,2', nullable: false },
      ],
    });

    const product = makeEntity({
      left: 800,
      top: 430,
      entityName: 'Product',
      fields: [
        idField,
        { name: 'sku', type: 'string', length: 64, unique: true, nullable: false },
        { name: 'name', type: 'string', length: 128, nullable: false },
        { name: 'price', type: 'decimal', length: '12,2', nullable: false },
        { name: 'stock', type: 'number', length: 11, nullable: false, default: 0 },
      ],
    });

    const category = makeEntity({
      left: 80,
      top: 460,
      entityName: 'Category',
      fields: [
        idField,
        { name: 'name', type: 'string', length: 128, nullable: false },
        { name: 'parentId', type: 'number', length: 64, foreignKey: true, nullable: true, index: true },
        { name: 'sort', type: 'number', length: 11, default: 0 },
      ],
    });

    const user = makeEntity({
      left: 430,
      top: 480,
      entityName: 'User',
      fields: [
        idField,
        { name: 'username', type: 'string', length: 64, unique: true, nullable: false },
        { name: 'password', type: 'string', length: 128, nullable: false },
        { name: 'email', type: 'string', length: 128, nullable: false },
        { name: 'enabled', type: 'boolean', nullable: false, default: true },
      ],
    });

    const userProfile = makeEntity({
      left: 800,
      top: 760,
      entityName: 'UserProfile',
      fields: [
        idField,
        { name: 'userId', type: 'number', length: 64, foreignKey: true, unique: true, nullable: false },
        { name: 'avatar', type: 'string', length: 255, nullable: true },
        { name: 'bio', type: 'string', length: 255, nullable: true, comment: '个人简介' },
      ],
    });

    const role = makeEntity({
      left: 80,
      top: 780,
      entityName: 'Role',
      fields: [
        idField,
        { name: 'roleName', type: 'string', length: 64, unique: true, nullable: false },
        { name: 'roleCode', type: 'string', length: 64, nullable: false },
        { name: 'description', type: 'string', length: 255, nullable: true },
      ],
    });

    const permission = makeEntity({
      left: 430,
      top: 790,
      entityName: 'Permission',
      fields: [
        idField,
        { name: 'permName', type: 'string', length: 64, nullable: false },
        { name: 'permCode', type: 'string', length: 64, unique: true, nullable: false },
        { name: 'resource', type: 'string', length: 128, nullable: false },
      ],
    });

    function makeRelation(props) {
      const relation = new IED.Relation({
        style: {
          strokeStyle: '#64748b',
          fillStyle: '#334155',
          lineWidth: 2,
        },
        arrow: 'end',
        ...props,
      });
      ice.addChild(relation);
      return relation;
    }

    makeRelation({
      relationType: 'one-to-many',
      sourceField: 'id',
      targetField: 'customerId',
      links: { start: { id: customer.state.id, position: 'R' }, end: { id: order.state.id, position: 'L' } },
    });
    makeRelation({
      relationType: 'one-to-many',
      sourceField: 'id',
      targetField: 'orderId',
      links: { start: { id: order.state.id, position: 'R' }, end: { id: orderItem.state.id, position: 'L' } },
    });
    makeRelation({
      relationType: 'one-to-many',
      sourceField: 'id',
      targetField: 'productId',
      links: { start: { id: product.state.id, position: 'T' }, end: { id: orderItem.state.id, position: 'B' } },
    });
    makeRelation({
      relationType: 'one-to-many',
      sourceField: 'id',
      targetField: 'parentId',
      sourceCardinality: '1',
      targetCardinality: '0..N',
      fromKey: 'children',
      toKey: 'parent',
      links: { start: { id: category.state.id, position: 'L' }, end: { id: category.state.id, position: 'T' } },
    });
    makeRelation({
      relationType: 'one-to-one',
      sourceField: 'id',
      targetField: 'userId',
      onDelete: 'CASCADE',
      onUpdate: 'CASCADE',
      links: { start: { id: user.state.id, position: 'R' }, end: { id: userProfile.state.id, position: 'L' } },
    });
    makeRelation({
      relationType: 'many-to-many',
      sourceField: 'id',
      targetField: 'id',
      joinTableName: 'user_roles',
      links: { start: { id: user.state.id, position: 'B' }, end: { id: role.state.id, position: 'T' } },
    });
    makeRelation({
      relationType: 'many-to-many',
      sourceField: 'id',
      targetField: 'id',
      joinTableName: 'role_permissions',
      links: { start: { id: role.state.id, position: 'R' }, end: { id: permission.state.id, position: 'L' } },
    });
  </script>
</html>
