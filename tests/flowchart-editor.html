<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>IED-flowchart-editor</title>
  <!-- 依赖只走本地 ../dist（IED 已把 ice-render 内核打包进产物），离线可跑、e2e 可复现。
       流程图图元（FlowNode / FlowEdge / FlowDesigner）由 IED 库提供，本页只做 UI 编排。 -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .app {
      display: flex;
      min-height: 100vh;
    }
    .workspace {
      flex: 1;
      padding: 12px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      align-items: center;
    }
    .toolbar-divider {
      width: 1px;
      height: 26px;
      background: #cbd5e1;
      margin: 0 2px;
      flex: 0 0 auto;
    }
    button,
    select,
    input[type="text"],
    input[type="number"] {
      font: inherit;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #0f172a;
    }
    button {
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      border-color: #94a3b8;
      background: #f1f5f9;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.active {
      border-color: #0f766e;
      color: #0f766e;
      background: #ecfdf5;
      font-weight: 600;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .icon-btn svg {
      width: 18px;
      height: 18px;
    }
    /* 纯 CSS tooltip：与 ER 示例保持一致的交互观感 */
    .icon-btn[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      border-radius: 6px;
      background: #0f172a;
      color: #ffffff;
      font-weight: 400;
      white-space: nowrap;
      z-index: 20;
    }
    .canvas-wrap {
      position: relative;
      display: block;
      flex: 1;
      min-height: 0;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      /* 画布 2200×1700 大于可视区：在画布区内滚动，工具条保持固定 */
      overflow: auto;
    }
    #canvas-1 {
      display: block;
      cursor: grab;
    }
    .link-preview {
      position: absolute;
      left: 0;
      top: 0;
      width: 2200px;
      height: 1700px;
      pointer-events: none;
      display: none;
    }
    .link-preview path {
      fill: none;
      stroke: #0f766e;
      stroke-width: 2;
      stroke-dasharray: 6 6;
    }
    .side {
      width: 360px;
      flex: 0 0 360px;
      border-left: 1px solid #e2e8f0;
      background: #ffffff;
      padding: 14px;
      overflow: auto;
      max-height: 100vh;
      box-sizing: border-box;
    }
    .side h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .side h3 + h3 {
      margin-top: 18px;
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .field-row label {
      width: 64px;
      color: #475569;
      flex: 0 0 auto;
    }
    .field-row input[type="text"],
    .field-row input[type="number"],
    .field-row select {
      flex: 1;
      min-width: 0;
    }
    .field-row input[type="color"] {
      width: 40px;
      height: 30px;
      padding: 2px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
    }
    #shape-panel .hint,
    .hint {
      color: #64748b;
    }
    #json-output {
      margin: 0;
      max-height: 260px;
      overflow: auto;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre;
    }
    #status-output {
      min-height: 20px;
      margin-top: 8px;
    }
  </style>
  <body>
    <div class="app">
      <div class="workspace">
        <div class="toolbar">
          <button id="btn-add-terminator">开始 / 结束</button>
          <button id="btn-add-process">处理</button>
          <button id="btn-add-decision">判定</button>
          <button id="btn-add-io">输入 / 输出</button>
          <span class="toolbar-divider"></span>
          <button id="btn-delete-selected" class="icon-btn" title="删除选中">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14H6L5 6" /><path d="M8 6V4h8v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>
          </button>
          <button id="btn-undo" class="icon-btn" title="撤销">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg>
          </button>
          <button id="btn-redo" class="icon-btn" title="重做">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10" /><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" /></svg>
          </button>
          <span class="toolbar-divider"></span>
          <select id="edge-shape" title="连线形态">
            <option value="visio">Visio 折线</option>
            <option value="bezier">贝塞尔曲线</option>
          </select>
          <button id="btn-toggle-link" class="icon-btn" title="连接节点">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg>
          </button>
          <span class="toolbar-divider"></span>
          <button id="btn-fit">适应视图</button>
          <button id="btn-reset">重置视图</button>
          <button id="btn-seed">恢复示例</button>
          <button id="btn-clear">清空</button>
          <span class="toolbar-divider"></span>
          <button id="btn-save">保存</button>
          <button id="btn-load">加载</button>
          <button id="btn-export">导出 JSON</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="canvas-1" width="2200" height="1700"></canvas>
          <svg id="link-preview" class="link-preview" viewBox="0 0 2200 1700" preserveAspectRatio="none">
            <path id="link-preview-path" d="" />
          </svg>
        </div>
      </div>
      <aside class="side">
        <h3>节点 / 连线属性</h3>
        <div id="shape-panel" class="hint">点击画布中的节点或连线进行编辑；滚轮缩放、空白处拖拽平移；打开「连接节点」后依次点击两个节点即可连线。</div>
        <h3>连线提示</h3>
        <div id="relation-hint" class="hint">选择连线形态后点击“连接节点”</div>
        <h3>流程 JSON</h3>
        <div id="flow-stats" class="hint"></div>
        <pre id="json-output">{}</pre>
        <div id="status-output"></div>
      </aside>
    </div>

    <script src="../dist/index.umd.js"></script>
    <script type="text/javascript">
      /* 流程图相关的类全部来自 IED 库（FlowNode / FlowEdge / FlowDesigner / FLOW_NODE_KINDS），
         本页只负责 UI：工具条、属性面板、连线模式与画布事件。 */
      const { ICE, FlowDesigner, FlowNode, FlowEdge, FLOW_NODE_KINDS } = IED;

      const ice = new ICE().init('canvas-1');
      const designer = new FlowDesigner(ice);
      window.__ice = ice;
      window.__designer = designer;
      window.__flow = designer;
      // 画布上的选中/删除等操作由 designer 内部广播，统一在这里刷新面板与 JSON 预览
      designer.subscribe(() => renderPanel());

      const canvasEl = document.getElementById('canvas-1');
      const linkPreview = document.getElementById('link-preview');
      const linkPreviewPath = document.getElementById('link-preview-path');
      const shapePanel = document.getElementById('shape-panel');
      const relationHint = document.getElementById('relation-hint');
      const jsonOutput = document.getElementById('json-output');
      const statusOutput = document.getElementById('status-output');
      const edgeShapeSelect = document.getElementById('edge-shape');
      const storageKey = 'ied-flowchart-project';

      let linkingMode = false;
      let linkSource = null;

      document.querySelectorAll('.icon-btn[title]').forEach((button) => {
        button.dataset.tooltip = button.getAttribute('title');
      });

      /* 画布交互：滚轮缩放走引擎原语 ICE.zoomAt（锚点缩放，内部已做钳制），
         空白处/中键拖拽平移由应用层实现（引擎只提供 setViewport/hitTest 原语） */
      canvasEl.addEventListener(
        'wheel',
        (evt) => {
          evt.preventDefault();
          // 参数：锚点 canvas 坐标、缩放倍数、最小/最大 scale
          ice.zoomAt(evt.offsetX, evt.offsetY, evt.deltaY > 0 ? 1 / 1.1 : 1.1, 0.3, 3);
        },
        { passive: false }
      );

      let panning = false;
      let panLastX = 0;
      let panLastY = 0;

      /* 内置示例：一个下单流程，坐标写死（不跑随机布局，保证 e2e/截图可复现） */
      const SEED_FLOW = {
        nodes: [
          { kind: 'terminator', title: '开始', left: 610, top: 60, width: 180, height: 60 },
          { kind: 'process', title: '浏览商品', left: 590, top: 190, width: 220, height: 80 },
          { kind: 'process', title: '加入购物车', left: 590, top: 320, width: 220, height: 80 },
          { kind: 'process', title: '提交订单', left: 590, top: 450, width: 220, height: 80 },
          { kind: 'decision', title: '库存充足？', left: 600, top: 590, width: 200, height: 120 },
          { kind: 'process', title: '创建支付单', left: 590, top: 780, width: 220, height: 80 },
          { kind: 'decision', title: '支付成功？', left: 600, top: 920, width: 200, height: 120 },
          { kind: 'process', title: '安排发货', left: 590, top: 1110, width: 220, height: 80 },
          { kind: 'terminator', title: '结束', left: 610, top: 1250, width: 180, height: 60 },
          { kind: 'io', title: '通知补货', left: 990, top: 590, width: 220, height: 80 },
          { kind: 'terminator', title: '结束（缺货）', left: 1010, top: 760, width: 180, height: 60 },
          { kind: 'process', title: '关闭订单', left: 990, top: 920, width: 220, height: 80 },
          { kind: 'terminator', title: '结束（未成交）', left: 1010, top: 1090, width: 180, height: 60 },
        ],
        edges: [
          { sourceIndex: 0, targetIndex: 1, sourcePort: 'B', targetPort: 'T' },
          { sourceIndex: 1, targetIndex: 2, sourcePort: 'B', targetPort: 'T' },
          { sourceIndex: 2, targetIndex: 3, sourcePort: 'B', targetPort: 'T' },
          { sourceIndex: 3, targetIndex: 4, sourcePort: 'B', targetPort: 'T' },
          { sourceIndex: 4, targetIndex: 5, sourcePort: 'B', targetPort: 'T', label: '是' },
          { sourceIndex: 4, targetIndex: 9, sourcePort: 'R', targetPort: 'L', label: '否' },
          { sourceIndex: 9, targetIndex: 10, sourcePort: 'B', targetPort: 'T' },
          { sourceIndex: 5, targetIndex: 6, sourcePort: 'B', targetPort: 'T' },
          { sourceIndex: 6, targetIndex: 7, sourcePort: 'B', targetPort: 'T', label: '是' },
          { sourceIndex: 6, targetIndex: 11, sourcePort: 'R', targetPort: 'L', label: '否' },
          { sourceIndex: 11, targetIndex: 12, sourcePort: 'B', targetPort: 'T' },
          { sourceIndex: 7, targetIndex: 8, sourcePort: 'B', targetPort: 'T' },
        ],
      };

      function buildSeed() {
        designer.clear();
        const created = SEED_FLOW.nodes.map((item) => designer.createNode(item.kind, item));
        SEED_FLOW.edges.forEach((edge) => {
          designer.createEdge({
            sourceId: created[edge.sourceIndex].state.id,
            targetId: created[edge.targetIndex].state.id,
            sourcePort: edge.sourcePort,
            targetPort: edge.targetPort,
            label: edge.label,
            linkShape: edgeShapeSelect.value,
          });
        });
        designer.select(null);
        // 建示例的这批操作不该占用撤销栈
        designer.resetHistory();
      }

      function refreshHistoryButtons() {
        document.getElementById('btn-undo').disabled = !designer.canUndo();
        document.getElementById('btn-redo').disabled = !designer.canRedo();
      }

      function setStatus(text, color) {
        statusOutput.textContent = text || '';
        statusOutput.style.color = color || '#64748b';
      }

      /**
       * 属性面板。
       *
       * 关键约定：**只有「选中的对象变了」才重建 DOM**，同一对象的后续变更走
       * `syncPanelValues()` 原地同步。早期版本每次变更都 `innerHTML = ''` 重建，
       * 会把正在交互的原生 `<input type="color">` 从 DOM 里摘掉 —— 真机上表现为
       * 「点开取色器选颜色，一松手控件就没了，颜色改不动」。
       */
      let panelKey = null;
      let panelControls = null;
      let colorSession = false;

      function syncPanelValues(selected) {
        if (!selected || !panelControls) {
          return;
        }
        // 正在输入 / 正在取色的控件不要被回写打断
        const focused = document.activeElement;
        const syncValue = (element, value) => {
          if (!element || element === focused) {
            return;
          }
          if (element.value !== String(value)) {
            element.value = value;
          }
        };
        if (selected.constructor.typeId === FlowNode.typeId) {
          syncValue(panelControls.title, selected.state.title || '');
          syncValue(panelControls.kind, selected.state.kind);
          syncValue(panelControls.fill, selected.state.fillColor || FLOW_NODE_KINDS[selected.state.kind].fill);
          syncValue(panelControls.stroke, selected.state.strokeColor || FLOW_NODE_KINDS[selected.state.kind].stroke);
          syncValue(panelControls.textColor, selected.state.textColor || '#0f172a');
          syncValue(panelControls.fontSize, selected.state.fontSize || 14);
          syncValue(panelControls.width, selected.state.width);
          syncValue(panelControls.height, selected.state.height);
          return;
        }
        syncValue(panelControls.label, selected.state.label || '');
        syncValue(panelControls.lineColor, (selected.state.style && selected.state.style.strokeStyle) || '#475569');
        syncValue(panelControls.lineWidth, (selected.state.style && selected.state.style.lineWidth) || 1.6);
        syncValue(panelControls.labelColor, (selected.state.labelStyle && selected.state.labelStyle.fillStyle) || '#334155');
        syncValue(panelControls.shape, selected.state.linkShape || 'visio');
      }

      function renderPanel() {
        const selected = designer.selected;
        jsonOutput.textContent = JSON.stringify(designer.toSnapshot(), null, 2);
        document.getElementById('flow-stats').textContent = `当前流程：${designer.nodes.length} 个节点 / ${designer.edges.length} 条连线`;
        refreshHistoryButtons();
        if (!selected) {
          panelKey = null;
          panelControls = null;
          shapePanel.className = 'hint';
          shapePanel.textContent = '点击画布中的节点或连线进行编辑；滚轮缩放、空白处拖拽平移；打开「连接节点」后依次点击两个节点即可连线。';
          return;
        }

        const key = `${selected.constructor.typeId}:${selected.state.id}`;
        if (key === panelKey) {
          syncPanelValues(selected);
          return;
        }
        // 选中对象变了才重建
        panelKey = key;
        panelControls = null;
        colorSession = false;
        shapePanel.className = '';
        shapePanel.innerHTML = '';

        const row = (labelText, control) => {
          const div = document.createElement('div');
          div.className = 'field-row';
          const label = document.createElement('label');
          label.textContent = labelText;
          div.appendChild(label);
          div.appendChild(control);
          shapePanel.appendChild(div);
          return control;
        };

        if (selected.constructor.typeId === FlowNode.typeId) {
          const titleInput = document.createElement('input');
          titleInput.type = 'text';
          titleInput.dataset.field = 'title';
          titleInput.value = selected.state.title || '';
          titleInput.addEventListener('change', () => {
            designer.updateNode(selected.state.id, { title: titleInput.value });
          });
          panelControls = { title: row('标题', titleInput) };

          const kindSelect = document.createElement('select');
          kindSelect.dataset.field = 'kind';
          Object.keys(FLOW_NODE_KINDS).forEach((kind) => {
            const option = document.createElement('option');
            option.value = kind;
            option.textContent = FLOW_NODE_KINDS[kind].label;
            kindSelect.appendChild(option);
          });
          kindSelect.value = selected.state.kind;
          kindSelect.addEventListener('change', () => {
            const preset = FLOW_NODE_KINDS[kindSelect.value];
            designer.updateNode(selected.state.id, {
              kind: kindSelect.value,
              width: preset.width,
              height: preset.height,
              fillColor: preset.fill,
              strokeColor: preset.stroke,
            });
          });
          panelControls.kind = row('类型', kindSelect);

          const fillInput = document.createElement('input');
          fillInput.type = 'color';
          fillInput.dataset.field = 'fill';
          fillInput.value = selected.state.fillColor || FLOW_NODE_KINDS[selected.state.kind].fill;
          fillInput.addEventListener('input', () => {
            // 取色器拖动过程中实时反馈：首次 input 记一次历史（记的是改之前的状态），
            // 后续 input 直接改图元，避免拖一次产生几十条撤销记录
            if (!colorSession) {
              designer.captureHistory();
              colorSession = true;
            }
            selected.applyPatch({ fillColor: fillInput.value });
            renderPanel();
          });
          fillInput.addEventListener('change', () => {
            if (colorSession) {
              colorSession = false;
              selected.applyPatch({ fillColor: fillInput.value });
              renderPanel();
              return;
            }
            designer.updateNode(selected.state.id, { fillColor: fillInput.value });
          });
          panelControls.fill = row('填充', fillInput);

          const strokeInput = document.createElement('input');
          strokeInput.type = 'color';
          strokeInput.dataset.field = 'stroke';
          strokeInput.value = selected.state.strokeColor || FLOW_NODE_KINDS[selected.state.kind].stroke;
          strokeInput.addEventListener('input', () => {
            if (!colorSession) {
              designer.captureHistory();
              colorSession = true;
            }
            selected.applyPatch({ strokeColor: strokeInput.value });
            renderPanel();
          });
          strokeInput.addEventListener('change', () => {
            if (colorSession) {
              colorSession = false;
              selected.applyPatch({ strokeColor: strokeInput.value });
              renderPanel();
              return;
            }
            designer.updateNode(selected.state.id, { strokeColor: strokeInput.value });
          });
          panelControls.stroke = row('边框', strokeInput);

          const textColorInput = document.createElement('input');
          textColorInput.type = 'color';
          textColorInput.dataset.field = 'textColor';
          textColorInput.value = selected.state.textColor || '#0f172a';
          textColorInput.addEventListener('input', () => {
            if (!colorSession) {
              designer.captureHistory();
              colorSession = true;
            }
            selected.applyPatch({ textColor: textColorInput.value });
            renderPanel();
          });
          textColorInput.addEventListener('change', () => {
            if (colorSession) {
              colorSession = false;
              selected.applyPatch({ textColor: textColorInput.value });
              renderPanel();
              return;
            }
            designer.updateNode(selected.state.id, { textColor: textColorInput.value });
          });
          panelControls.textColor = row('文字颜色', textColorInput);

          const fontSizeInput = document.createElement('input');
          fontSizeInput.type = 'number';
          fontSizeInput.dataset.field = 'fontSize';
          fontSizeInput.min = '8';
          fontSizeInput.value = selected.state.fontSize || 14;
          fontSizeInput.addEventListener('change', () => {
            designer.updateNode(selected.state.id, { fontSize: Number(fontSizeInput.value) || selected.state.fontSize });
          });
          panelControls.fontSize = row('文字字号', fontSizeInput);

          [
            ['宽度', 'width'],
            ['高度', 'height'],
          ].forEach(([labelText, key]) => {
            const input = document.createElement('input');
            input.type = 'number';
            input.dataset.field = key;
            input.min = '40';
            input.value = selected.state[key];
            input.addEventListener('change', () => {
              designer.updateNode(selected.state.id, { [key]: Number(input.value) || selected.state[key] });
            });
            panelControls[key] = row(labelText, input);
          });

          const hint = document.createElement('div');
          hint.className = 'hint';
          hint.textContent = `节点 id：${selected.state.id}`;
          shapePanel.appendChild(hint);
          return;
        }

        // 连线
        const labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.dataset.field = 'label';
        labelInput.placeholder = '例如：是 / 否';
        labelInput.value = selected.state.label || '';
        labelInput.addEventListener('change', () => {
          designer.updateEdge(selected.state.id, { label: labelInput.value });
        });
        panelControls = { label: row('标签', labelInput) };

        const lineColorInput = document.createElement('input');
        lineColorInput.type = 'color';
        lineColorInput.dataset.field = 'lineColor';
        lineColorInput.value = (selected.state.style && selected.state.style.strokeStyle) || '#475569';
        lineColorInput.addEventListener('change', () => {
          designer.updateEdge(selected.state.id, { style: { strokeStyle: lineColorInput.value, fillStyle: lineColorInput.value } });
        });
        panelControls.lineColor = row('连线颜色', lineColorInput);

        const lineWidthInput = document.createElement('input');
        lineWidthInput.type = 'number';
        lineWidthInput.dataset.field = 'lineWidth';
        lineWidthInput.min = '0.5';
        lineWidthInput.step = '0.5';
        lineWidthInput.value = (selected.state.style && selected.state.style.lineWidth) || 1.6;
        lineWidthInput.addEventListener('change', () => {
          designer.updateEdge(selected.state.id, { style: { lineWidth: Number(lineWidthInput.value) || 1.6 } });
        });
        panelControls.lineWidth = row('连线粗细', lineWidthInput);

        const labelColorInput = document.createElement('input');
        labelColorInput.type = 'color';
        labelColorInput.dataset.field = 'labelColor';
        labelColorInput.value = (selected.state.labelStyle && selected.state.labelStyle.fillStyle) || '#334155';
        labelColorInput.addEventListener('change', () => {
          designer.updateEdge(selected.state.id, { labelStyle: { fillStyle: labelColorInput.value } });
        });
        panelControls.labelColor = row('标签颜色', labelColorInput);

        const shapeSelect = document.createElement('select');
        shapeSelect.dataset.field = 'shape';
        [
          ['visio', 'Visio 折线'],
          ['bezier', '贝塞尔曲线'],
        ].forEach(([value, text]) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = text;
          shapeSelect.appendChild(option);
        });
        shapeSelect.value = selected.state.linkShape || 'visio';
        shapeSelect.addEventListener('change', () => {
          designer.updateEdge(selected.state.id, { linkShape: shapeSelect.value });
        });
        panelControls.shape = row('形态', shapeSelect);

        const hint = document.createElement('div');
        hint.className = 'hint';
        const links = selected.state.links || {};
        hint.textContent = `连接：${(links.start && links.start.id) || '-'} → ${(links.end && links.end.id) || '-'}`;
        shapePanel.appendChild(hint);
      }

      /* ---------------- 工具栏 ---------------- */
      ['terminator', 'process', 'decision', 'io'].forEach((kind) => {
        document.getElementById(`btn-add-${kind}`).addEventListener('click', () => {
          designer.createNode(kind);
        });
      });

      document.getElementById('btn-delete-selected').addEventListener('click', () => {
        if (designer.selectedId) {
          designer.remove(designer.selectedId);
        }
      });

      document.getElementById('btn-undo').addEventListener('click', () => designer.undo());
      document.getElementById('btn-redo').addEventListener('click', () => designer.redo());
      document.getElementById('btn-fit').addEventListener('click', () => designer.fitViewport());
      document.getElementById('btn-reset').addEventListener('click', () => ice.setViewport(1, 0, 0));

      document.getElementById('btn-seed').addEventListener('click', () => {
        buildSeed();
        designer.fitViewport();
        setStatus('已恢复内置示例流程', '#059669');
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        designer.clear();
        setStatus('已清空画布', '#b45309');
      });

      document.getElementById('btn-save').addEventListener('click', () => {
        window.localStorage.setItem(storageKey, designer.serialize());
        setStatus('✅ 流程已保存到 localStorage', '#059669');
      });

      document.getElementById('btn-load').addEventListener('click', () => {
        const json = window.localStorage.getItem(storageKey);
        if (!json) {
          setStatus('⚠️ 没有可加载的流程', '#b45309');
          return;
        }
        let report;
        try {
          report = designer.load(json);
        } catch (error) {
          setStatus(`❌ 加载失败：${error.message}`, '#b91c1c');
          return;
        }
        if (report.skipped.length) {
          setStatus(`⚠️ 流程已加载，但跳过了 ${report.skipped.join('、')}`, '#b45309');
          return;
        }
        setStatus('✅ 流程已加载', '#059669');
      });

      document.getElementById('btn-export').addEventListener('click', () => {
        jsonOutput.textContent = JSON.stringify(designer.toSnapshot(), null, 2);
        jsonOutput.scrollIntoView({ block: 'nearest' });
        setStatus('已导出 JSON（见右侧面板）', '#0f766e');
      });

      document.getElementById('edge-shape').addEventListener('change', () => {
        const selected = designer.selected;
        if (selected && selected.constructor.typeId === FlowEdge.typeId) {
          designer.updateEdge(selected.state.id, { linkShape: edgeShapeSelect.value });
        }
      });

      /* ---------------- 连线模式与画布交互 ---------------- */
      function hideLinkPreview() {
        linkPreview.style.display = 'none';
        linkPreviewPath.setAttribute('d', '');
      }

      function setLinkingMode(enabled) {
        linkingMode = enabled;
        linkSource = null;
        hideLinkPreview();
        const button = document.getElementById('btn-toggle-link');
        button.classList.toggle('active', enabled);
        canvasEl.style.cursor = enabled ? 'crosshair' : 'grab';
        relationHint.textContent = enabled ? '依次点击两个节点：先源节点，再目标节点' : '选择连线形态后点击“连接节点”';
        relationHint.style.color = '#64748b';
      }

      document.getElementById('btn-toggle-link').addEventListener('click', () => setLinkingMode(!linkingMode));

      function showLinkPreview(node) {
        const box = node.getMinBoundingBox(true);
        const from = ice.worldToScreen(box.bc[0], box.bc[1]);
        linkPreview.style.display = 'block';
        linkPreviewPath.setAttribute('d', `M ${from[0]} ${from[1]} L ${from[0]} ${from[1]}`);
      }

      canvasEl.addEventListener('mousemove', (evt) => {
        if (linkingMode && linkSource) {
          const box = linkSource.getMinBoundingBox(true);
          const from = ice.worldToScreen(box.bc[0], box.bc[1]);
          linkPreviewPath.setAttribute('d', `M ${from[0]} ${from[1]} L ${evt.offsetX} ${evt.offsetY}`);
        }
        if (!panning) {
          return;
        }
        const dx = evt.offsetX - panLastX;
        const dy = evt.offsetY - panLastY;
        panLastX = evt.offsetX;
        panLastY = evt.offsetY;
        ice.setViewport(ice.viewport.scale, ice.viewport.tx + dx, ice.viewport.ty + dy);
      });

      function stopPanning() {
        panning = false;
        canvasEl.style.cursor = linkingMode ? 'crosshair' : 'grab';
      }

      canvasEl.addEventListener('mouseup', stopPanning);
      canvasEl.addEventListener('mouseleave', stopPanning);
      canvasEl.addEventListener('auxclick', (evt) => {
        // 中键：禁止浏览器默认的自动滚动
        if (evt.button === 1) {
          evt.preventDefault();
        }
      });

      function canvasNodeAt(px, py) {
        let node = ice.hitTest(px, py);
        while (node && node.parentNode) {
          node = node.parentNode;
        }
        return node && node.constructor.typeId === FlowNode.typeId ? node : null;
      }

      canvasEl.addEventListener('mousedown', (evt) => {
        if (linkingMode) {
          const node = canvasNodeAt(evt.offsetX, evt.offsetY);
          if (!node) {
            return;
          }
          evt.preventDefault();
          evt.stopPropagation();
          if (!linkSource) {
            linkSource = node;
            showLinkPreview(node);
            relationHint.textContent = `已选择源节点：${node.state.title}，请点击目标节点`;
            relationHint.style.color = '#0f766e';
            return;
          }
          if (linkSource.state.id === node.state.id) {
            relationHint.textContent = '源节点和目标节点不能相同，请重新选择';
            relationHint.style.color = '#b45309';
            linkSource = null;
            hideLinkPreview();
            return;
          }
          designer.createEdge({
            sourceId: linkSource.state.id,
            targetId: node.state.id,
            sourcePort: 'B',
            targetPort: 'T',
            linkShape: edgeShapeSelect.value,
          });
          linkSource = null;
          hideLinkPreview();
          setLinkingMode(false);
          return;
        }

        // 非连线模式：空白处左键 / 任意位置中键 → 拖拽平移画布
        const blank = evt.button === 0 && !ice.hitTest(evt.offsetX, evt.offsetY);
        if (evt.button !== 1 && !blank) {
          return;
        }
        evt.preventDefault();
        evt.stopPropagation();
        panning = true;
        panLastX = evt.offsetX;
        panLastY = evt.offsetY;
        canvasEl.style.cursor = 'grabbing';
      });

      // 点击画布空白处清除选中。
      // 注意：引擎的事件拦截是**全局**的，右侧面板/工具条上的点击也会派发到 ice.evtBus
      // （target 是面板里的 input，且没有命中任何组件）。这里必须按 target 过滤，
      // 否则点一下面板输入框就会把选中清掉 —— 面板随即退回提示态、正在交互的
      // 取色器/文本框被销毁（真实表现：颜色根本改不动）。
      ice.evtBus.on('mousedown', (evt) => {
        const component = evt && evt.param && evt.param.component;
        const original = evt && evt.originalEvent;
        const target = original && original.target;
        const fromCanvas = !target || target === canvasEl;
        if (!component && fromCanvas && designer.selectedId) {
          designer.select(null);
        }
      });

      // 键盘快捷键：Cmd/Ctrl + Z 撤销、Shift 组合重做
      window.addEventListener('keydown', (evt) => {
        const meta = evt.metaKey || evt.ctrlKey;
        if (!meta || (evt.key !== 'z' && evt.key !== 'Z')) {
          return;
        }
        evt.preventDefault();
        if (evt.shiftKey) {
          designer.redo();
        } else {
          designer.undo();
        }
      });

      /* ---------------- 启动 ---------------- */
      buildSeed();
      designer.fitViewport();
      renderPanel();
      setStatus('示例流程已就绪：可拖拽节点、连线、改属性，或点「清空」从零开始', '#64748b');
    </script>
  </body>
</html>
