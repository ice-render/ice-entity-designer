<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>IED-entity-editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.26.5/dist/reset.css" />
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd@5.26.5/dist/antd.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .app {
      display: flex;
      min-height: 100vh;
    }
    .workspace {
      flex: 1;
      padding: 12px;
      min-width: 0;
      overflow: auto;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .toolbar-divider {
      width: 1px;
      height: 26px;
      background: #cbd5e1;
      margin: 0 2px;
      align-self: center;
      flex: 0 0 auto;
    }
    button,
    select,
    input[type="text"] {
      font: inherit;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #0f172a;
    }
    button {
      cursor: pointer;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }
    .icon-btn {
      position: relative;
    }
    .icon-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) scale(0.96);
      transform-origin: top center;
      background: #0f172a;
      color: #ffffff;
      font-size: 12px;
      line-height: 1.2;
      padding: 5px 8px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 20;
    }
    .icon-btn:hover::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    button:hover {
      border-color: #6366f1;
    }
    canvas {
      display: block;
      width: 2200px;
      height: 1700px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      cursor: grab;
    }
    .canvas-wrap {
      position: relative;
      overflow: auto;
    }
    .link-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }
    .link-preview path {
      stroke: #0f766e;
      stroke-width: 2;
      stroke-dasharray: 6 4;
      fill: none;
    }
    .side {
      width: 560px;
      padding: 14px;
      border-left: 1px solid #e2e8f0;
      background: #ffffff;
      box-sizing: border-box;
      overflow: auto;
    }
    .side h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 90px 58px auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .field-row input {
      min-width: 0;
    }
    .checks {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 2px 0 10px;
    }
    .checks label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .field-extras {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 6px;
      margin: -2px 0 10px;
    }
    .relation-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    pre {
      max-height: 220px;
      overflow: auto;
      background: #0f172a;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      white-space: pre-wrap;
    }
    #entity-panel {
      font-size: 12px;
    }
    #entity-panel .ant-table {
      font-size: 12px;
    }
    #entity-panel .ant-table-thead > tr > th,
    #entity-panel .ant-table-tbody > tr > td {
      padding: 4px 6px !important;
    }
    #entity-panel .ant-table-cell .ant-input,
    #entity-panel .ant-table-cell .ant-select-selector,
    #entity-panel .ant-table-cell .ant-checkbox-wrapper {
      font-size: 12px;
    }
    #entity-panel .ant-input,
    #entity-panel .ant-select-selector {
      padding-top: 2px;
      padding-bottom: 2px;
    }
    #entity-panel .ant-btn {
      font-size: 12px;
      height: 24px;
      padding-inline: 7px;
    }
    #entity-panel .ant-form-item {
      margin-bottom: 8px;
    }
  </style>
  <body>
    <div class="app">
      <div class="workspace">
        <div class="toolbar">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button id="btn-delete-selected" class="icon-btn" title="删除选中">

          </button>

          </button>

          </button>

          </button>
          <button id="btn-layout-vertical" class="icon-btn" title="垂直流程布局">

          </button>
          <select id="rel-type" title="关系类型">
            <option value="one-to-many">one-to-many</option>
            <option value="many-to-one">many-to-one</option>
            <option value="one-to-one">one-to-one</option>
            <option value="many-to-many">many-to-many</option>
          </select>
          <button id="btn-toggle-link" class="icon-btn" title="连接关系">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg>

        </div>
        <div class="canvas-wrap">
          <canvas id="canvas-1" width="2200" height="1700"></canvas>
          <svg id="link-preview" class="link-preview" viewBox="0 0 2200 1700" preserveAspectRatio="none">
            <path id="link-preview-path" d="" />

      </div>
      <aside class="side">
        <h3>实体属性</h3>
        <div id="entity-panel">点击画布中的 Entity 进行编辑</div>
        <h3 style="margin-top: 18px;">关系</h3>
        <div id="relation-hint" style="min-height: 20px; color: #64748b;">选择关系类型后点击“连接关系”</div>
        <pre id="schema-output" hidden></pre>
        <div id="validation-output"></div>
      </aside>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script type="text/javascript">
      const ice = new ICE.ICE().init('canvas-1');
      const designer = new IED.EntityDesigner(ice);
      window.__ice = ice;
      window.__designer = designer;
      ice.alignmentGuide.enable({ threshold: 6 });

      const canvasEl = document.getElementById('canvas-1');
      const linkPreview = document.getElementById('link-preview');
      const linkPreviewPath = document.getElementById('link-preview-path');
      const entityPanel = document.getElementById('entity-panel');
      const schemaOutput = document.getElementById('schema-output');
      const validationOutput = document.getElementById('validation-output');

      document.querySelectorAll('.icon-btn[title]').forEach((button) => {
        button.dataset.tooltip = button.getAttribute('title');
        button.removeAttribute('title');
      });

      // 画布默认支持滚轮缩放 + 空白/中键拖拽。
      function zoomAtClientPoint(clientX, clientY, factor) {
        const oldScale = ice.viewport.scale;
        const nextScale = Math.max(0.3, Math.min(3, oldScale * factor));
        const rect = canvasEl.getBoundingClientRect();
        const cx = clientX - rect.left;
        const cy = clientY - rect.top;
        const tx = cx - ((cx - ice.viewport.tx) * nextScale) / oldScale;
        const ty = cy - ((cy - ice.viewport.ty) * nextScale) / oldScale;
        ice.setViewport(nextScale, tx, ty);
      }
      canvasEl.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        zoomAtClientPoint(evt.clientX, evt.clientY, evt.deltaY > 0 ? 0.9 : 1.1);
      });

      let panning = false;
      let lastX = 0;
      let lastY = 0;
      let linkingMode = false;
      let linkSource = null;

      function findRootEntity(component) {
        let root = component;
        while (root && root.parentNode) {
          root = root.parentNode;
        }
        return root && root.constructor && root.constructor.name === 'Entity' ? root : null;
      }

      function entityCenterInCanvas(entity) {
        const box = entity.getMinBoundingBox(true);
        const center = box.center;
        return ice.worldToScreen(center[0], center[1]);
      }

      function showLinkPreview(entity) {
        const [x, y] = entityCenterInCanvas(entity);
        linkPreviewPath.setAttribute('d', orthogonalPreviewPath(x, y, x, y));
        linkPreview.style.display = 'block';
      }

      function hideLinkPreview() {
        linkPreview.style.display = 'none';
      }

      function orthogonalPreviewPath(x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        if (Math.abs(dx) > Math.abs(dy)) {
          const midX = (x1 + x2) / 2;
          return `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
        }
        const midY = (y1 + y2) / 2;
        return `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;
      }

      function canvasPoint(evt) {
        return [evt.offsetX, evt.offsetY];
      }

      canvasEl.addEventListener('mousedown', (evt) => {
        if (linkingMode) {
          const [px, py] = canvasPoint(evt);
          const hit = ice.hitTest(px, py);
          const entity = findRootEntity(hit);
          if (entity) {
            evt.preventDefault();
            evt.stopPropagation();
            if (!linkSource) {
              linkSource = entity;
              showLinkPreview(entity);
              document.getElementById('relation-hint').textContent = `已选择源 Entity：${entity.state.entityName}，请点击目标 Entity`;
              document.getElementById('relation-hint').style.color = '#0f766e';
            } else if (linkSource.state.id !== entity.state.id) {
              designer.createRelation({
                relationType: document.getElementById('rel-type').value,
                sourceId: linkSource.state.id,
                targetId: entity.state.id,
              });
              hideLinkPreview();
              setLinkingMode(false);
              renderPanel();
              refreshHistoryButtons();
            } else {
              document.getElementById('relation-hint').textContent = '源 Entity 和目标 Entity 不能相同，请重新选择';
              document.getElementById('relation-hint').style.color = '#b45309';
              linkSource = null;
              hideLinkPreview();
            }
          }
          return;
        }

        const [px, py] = canvasPoint(evt);
        const blank = evt.button === 0 && !ice.hitTest(px, py);
        if (evt.button !== 1 && !blank) return;
        evt.preventDefault();
        evt.stopPropagation();
        panning = true;
        lastX = px;
        lastY = py;
        canvasEl.style.cursor = 'grabbing';
      });
      canvasEl.addEventListener('mousemove', (evt) => {
        if (linkingMode && linkSource) {
          const [mx, my] = canvasPoint(evt);
          const [sx, sy] = entityCenterInCanvas(linkSource);
          linkPreviewPath.setAttribute('d', orthogonalPreviewPath(sx, sy, mx, my));
        }
        if (!panning) return;
        const [mx, my] = canvasPoint(evt);
        const dx = mx - lastX;
        const dy = my - lastY;
        lastX = mx;
        lastY = my;
        ice.setViewport(ice.viewport.scale, ice.viewport.tx + dx, ice.viewport.ty + dy);
      });
      canvasEl.addEventListener('mouseup', () => {
        panning = false;
        canvasEl.style.cursor = 'grab';
      });
      canvasEl.addEventListener('mouseleave', () => {
        panning = false;
        canvasEl.style.cursor = 'grab';
      });
      canvasEl.addEventListener('auxclick', (evt) => {
        if (evt.button === 1) evt.preventDefault();
      });

      function setLinkingMode(enabled) {
        linkingMode = enabled;
        linkSource = null;
        designer.entities.forEach((entity) => {
          entity.setState({ draggable: !enabled });
        });
        const hint = document.getElementById('relation-hint');
        const button = document.getElementById('btn-toggle-link');
        if (enabled) {
          hint.textContent = '连接模式：请先点击源 Entity，再点击目标 Entity';
          hint.style.color = '#0f766e';
          button.style.borderColor = '#0f766e';
          canvasEl.style.cursor = 'crosshair';
        } else {
          hideLinkPreview();
          hint.textContent = '选择关系类型后点击“连接关系”';
          hint.style.color = '#64748b';
          button.style.borderColor = '';
          canvasEl.style.cursor = 'grab';
        }
      }

      function fitViewportToContent(padding = 80) {
        const entities = designer.entities;
        if (!entities.length) return;
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        entities.forEach((entity) => {
          const box = entity.getMinBoundingBox(true);
          minX = Math.min(minX, box.tl[0]);
          minY = Math.min(minY, box.tl[1]);
          maxX = Math.max(maxX, box.br[0]);
          maxY = Math.max(maxY, box.br[1]);
        });
        const contentWidth = maxX - minX;
        const contentHeight = maxY - minY;
        if (contentWidth <= 0 || contentHeight <= 0) return;
        const scale = Math.min(
          (canvasEl.width - padding * 2) / contentWidth,
          (canvasEl.height - padding * 2) / contentHeight,
          1.25,
        );
        const tx = (canvasEl.width - contentWidth * scale) / 2 - minX * scale;
        const ty = (canvasEl.height - contentHeight * scale) / 2 - minY * scale;
        ice.setViewport(scale, tx, ty);
      }

      function relationSlotPoint(component, position) {
        const box = component.getMinBoundingBox(true);
        switch (position) {
          case 'T':
            return [...box.tc];
          case 'R':
            return [...box.rc];
          case 'B':
            return [...box.bc];
          case 'L':
            return [...box.lc];
          case 'C':
          default:
            return [...box.center];
        }
      }

      function routeRelations(direction) {
        designer.relations.forEach((relation) => {
          const startId = relation.state.links && relation.state.links.start && relation.state.links.start.id;
          const endId = relation.state.links && relation.state.links.end && relation.state.links.end.id;
          const source = startId ? ice.findComponent(startId) : null;
          const target = endId ? ice.findComponent(endId) : null;
          if (!source || !target) return;

          const sourceBox = source.getMinBoundingBox(true);
          const targetBox = target.getMinBoundingBox(true);
          let startPosition = 'R';
          let endPosition = 'L';

          if (source === target) {
            startPosition = 'L';
            endPosition = 'T';
          } else if (direction === 'LR') {
            startPosition = 'R';
            endPosition = 'L';
          } else if (direction === 'TB') {
            startPosition = 'B';
            endPosition = 'T';
          } else {
            const dx = targetBox.center[0] - sourceBox.center[0];
            const dy = targetBox.center[1] - sourceBox.center[1];
            if (Math.abs(dx) > Math.abs(dy)) {
              startPosition = dx >= 0 ? 'R' : 'L';
              endPosition = dx >= 0 ? 'L' : 'R';
            } else {
              startPosition = dy >= 0 ? 'B' : 'T';
              endPosition = dy >= 0 ? 'T' : 'B';
            }
          }

          const startPoint = relationSlotPoint(source, startPosition);
          const endPoint = relationSlotPoint(target, endPosition);
          relation.setState({
            routeType: 'orthogonal',
            routeOffset: 28,
            links: {
              start: { id: startId, position: startPosition },
              end: { id: endId, position: endPosition },
            },
            startPoint,
            endPoint,
          });
        });
      }

      function buildLayoutGraph() {
        const nodes = designer.entities.map((entity) => ({
          id: entity.state.id,
          entity,
          in: new Set(),
          out: new Set(),
          all: new Set(),
        }));
        const nodeMap = {};
        nodes.forEach((node) => {
          nodeMap[node.id] = node;
        });

        designer.relations.forEach((relation) => {
          const start = relation.state.links && relation.state.links.start && relation.state.links.start.id;
          const end = relation.state.links && relation.state.links.end && relation.state.links.end.id;
          if (!start || !end || !nodeMap[start] || !nodeMap[end] || start === end) return;
          nodeMap[start].out.add(end);
          nodeMap[end].in.add(start);
          nodeMap[start].all.add(end);
          nodeMap[end].all.add(start);
        });

        return { nodes, nodeMap };
      }

      function computeRanks(nodes, nodeMap) {
        const rank = {};
        const visit = (id, stack) => {
          if (rank[id] !== undefined) return rank[id];
          if (stack.has(id)) return 0;
          stack.add(id);
          let maxPred = -1;
          [...nodeMap[id].in].forEach((predId) => {
            maxPred = Math.max(maxPred, visit(predId, stack));
          });
          rank[id] = maxPred + 1;
          stack.delete(id);
          return rank[id];
        };
        nodes.forEach((node) => visit(node.id, new Set()));
        return rank;
      }

      function orderLayers(nodes, nodeMap, rank) {
        const layers = {};
        nodes.forEach((node) => {
          (layers[rank[node.id]] = layers[rank[node.id]] || []).push(node);
        });
        const rankList = Object.keys(layers)
          .map(Number)
          .sort((a, b) => a - b);
        rankList.forEach((r) => layers[r].forEach((node, index) => (node.order = index)));
        const rankIndexMap = {};
        rankList.forEach((r, index) => {
          rankIndexMap[r] = index;
        });

        const median = (values) => {
          const sorted = [...values].sort((a, b) => a - b);
          const mid = Math.floor(sorted.length / 2);
          return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        };

        const neighborOrders = (node, previousIds, nextIds) => {
          const orders = [];
          [...node.in].forEach((id) => {
            if (previousIds.has(id)) orders.push(nodeMap[id].order);
          });
          [...node.out].forEach((id) => {
            if (nextIds.has(id)) orders.push(nodeMap[id].order);
          });
          return orders;
        };

        const transposeLayer = (layer, neighborIds) => {
          let changed = true;
          let guard = 0;
          while (changed && guard < layer.length) {
            changed = false;
            guard++;
            for (let i = 0; i < layer.length - 1; i++) {
              const a = layer[i];
              const b = layer[i + 1];
              const score = (node) => {
                const orders = [...node.in, ...node.out]
                  .filter((id) => neighborIds.has(id))
                  .map((id) => nodeMap[id].order)
                  .sort((x, y) => x - y);
                if (!orders.length) return node.order;
                return Math.abs(node.order - median(orders));
              };
              if (score(b) < score(a)) {
                layer[i] = b;
                layer[i + 1] = a;
                changed = true;
              }
            }
          }
          layer.forEach((node, index) => (node.order = index));
        };

        for (let iter = 0; iter < 14; iter++) {
          const downward = iter % 2 === 0;
          const rankOrder = downward ? rankList : [...rankList].reverse();
          rankOrder.forEach((r) => {
            const rankIndex = rankIndexMap[r];
            const layer = layers[r];
            const previousLayer = layers[rankList[rankIndex - 1]];
            const nextLayer = layers[rankList[rankIndex + 1]];
            const previousIds = new Set(previousLayer ? previousLayer.map((node) => node.id) : []);
            const nextIds = new Set(nextLayer ? nextLayer.map((node) => node.id) : []);
            layer.forEach((node) => {
              const orders = neighborOrders(node, previousIds, nextIds);
              node.bary = orders.length ? median(orders) : node.order;
            });
            layer.sort((a, b) => a.bary - b.bary || a.id.localeCompare(b.id));
            layer.forEach((node, index) => (node.order = index));
            const neighborIds = downward ? nextIds : previousIds;
            if (neighborIds.size) {
              transposeLayer(layer, neighborIds);
            }
          });
        }

        return { layers, rankList };
      }

      function applyFlowLayout(direction) {
        designer.captureHistory();
        const { nodes, nodeMap } = buildLayoutGraph();
        if (!nodes.length) return;
        const rank = computeRanks(nodes, nodeMap);
        const { layers, rankList } = orderLayers(nodes, nodeMap, rank);
        const boxMap = {};
        nodes.forEach((node) => {
          boxMap[node.id] = node.entity.getMinBoundingBox(true);
        });
        const margin = 80;
        const gapX = 130;
        const gapY = 60;
        const positions = {};

        if (direction === 'LR') {
          let x = margin;
          rankList.forEach((r) => {
            const layer = layers[r];
            const maxWidth = layer.reduce((max, node) => Math.max(max, boxMap[node.id].width), 0);
            let y = margin;
            layer.forEach((node) => {
              positions[node.id] = { x, y };
              y += boxMap[node.id].height + gapY;
            });
            x += maxWidth + gapX;
          });
        } else {
          let y = margin;
          rankList.forEach((r) => {
            const layer = layers[r];
            const maxHeight = layer.reduce((max, node) => Math.max(max, boxMap[node.id].height), 0);
            let x = margin;
            layer.forEach((node) => {
              positions[node.id] = { x, y };
              x += boxMap[node.id].width + gapX;
            });
            y += maxHeight + gapY;
          });
        }

        const positionList = nodes.map((node) => positions[node.id]);
        const boxList = nodes.map((node) => boxMap[node.id]);
        resolveOverlaps(positionList, boxList);
        nodes.forEach((node, index) => {
          node.entity.setPosition(positionList[index].x, positionList[index].y);
        });
        routeRelations(direction);
        setLinkingMode(false);
        fitViewportToContent();
        refreshHistoryButtons();
      }

      function applyRadialLayout() {
        designer.captureHistory();
        const { nodes, nodeMap } = buildLayoutGraph();
        if (!nodes.length) return;
        const rootId =
          nodes.reduce((best, node) => (node.all.size > best.all.size ? node : best), nodes[0]).id;
        const depth = { [rootId]: 0 };
        const queue = [rootId];
        const visited = new Set([rootId]);
        while (queue.length) {
          const current = queue.shift();
          [...nodeMap[current].all].forEach((next) => {
            if (visited.has(next)) return;
            visited.add(next);
            depth[next] = depth[current] + 1;
            queue.push(next);
          });
        }

        const groups = {};
        nodes.forEach((node) => {
          const d = depth[node.id] === undefined ? 0 : depth[node.id];
          (groups[d] = groups[d] || []).push(node);
        });
        const depthList = Object.keys(groups)
          .map(Number)
          .sort((a, b) => a - b);
        const boxMap = {};
        let maxW = 0;
        let maxH = 0;
        nodes.forEach((node) => {
          const box = node.entity.getMinBoundingBox(true);
          boxMap[node.id] = box;
          maxW = Math.max(maxW, box.width);
          maxH = Math.max(maxH, box.height);
        });
        const baseSpacing = Math.max(maxW, maxH) + 110;
        const positions = {};

        depthList.forEach((d) => {
          const layer = groups[d] || [];
          const count = layer.length;
          const radius =
            d === 0
              ? 0
              : Math.max(baseSpacing, ((Math.max(maxW, maxH) + 90) * count) / (Math.PI * 2)) +
                (d - 1) * baseSpacing * 0.9;
          layer.forEach((node, index) => {
            if (d === 0) {
              positions[node.id] = { x: -boxMap[node.id].width / 2, y: -boxMap[node.id].height / 2 };
            } else {
              const angle = -Math.PI / 2 + (index / count) * Math.PI * 2 + d * 0.7;
              positions[node.id] = {
                x: radius * Math.cos(angle) - boxMap[node.id].width / 2,
                y: radius * Math.sin(angle) - boxMap[node.id].height / 2,
              };
            }
          });
        });

        const positionList = nodes.map((node) => positions[node.id]);
        const boxList = nodes.map((node) => boxMap[node.id]);
        resolveOverlaps(positionList, boxList);
        nodes.forEach((node, index) => {
          node.entity.setPosition(positionList[index].x, positionList[index].y);
        });
        routeRelations(null);
        setLinkingMode(false);
        fitViewportToContent();
        refreshHistoryButtons();
      }

      function resolveOverlaps(positions, boxes) {
        let moved = false;
        for (let iter = 0; iter < 400; iter++) {
          moved = false;
          for (let i = 0; i < positions.length; i++) {
            for (let j = i + 1; j < positions.length; j++) {
              const a = positions[i];
              const b = positions[j];
              const acx = a.x + boxes[i].width / 2;
              const acy = a.y + boxes[i].height / 2;
              const bcx = b.x + boxes[j].width / 2;
              const bcy = b.y + boxes[j].height / 2;
              const dx = bcx - acx;
              const dy = bcy - acy;
              const overlapX = (boxes[i].width + boxes[j].width) / 2 - Math.abs(dx);
              const overlapY = (boxes[i].height + boxes[j].height) / 2 - Math.abs(dy);
              if (overlapX <= 0 || overlapY <= 0) continue;
              moved = true;
              const push = Math.min(overlapX, overlapY) / 2;
              const length = Math.hypot(dx, dy);
              let ux = 0;
              let uy = 0;
              if (length > 0.001) {
                ux = dx / length;
                uy = dy / length;
              } else {
                ux = 1;
                uy = 0;
              }
              a.x -= ux * push;
              a.y -= uy * push;
              b.x += ux * push;
              b.y += uy * push;
            }
          }
          if (!moved) break;
        }
      }

      function applyForceLayout() {
        designer.captureHistory();
        const { nodes, nodeMap } = buildLayoutGraph();
        if (!nodes.length) return;
        const boxMap = {};
        nodes.forEach((node) => {
          boxMap[node.id] = node.entity.getMinBoundingBox(true);
        });

        const positions = nodes.map((node, index) => {
          const col = index % 6;
          const row = Math.floor(index / 6);
          return {
            id: node.id,
            x: canvasEl.width / 2 + (col - 2.5) * 320 + Math.random() * 40,
            y: canvasEl.height / 2 + (row - 2.5) * 260 + Math.random() * 40,
          };
        });
        const posMap = {};
        positions.forEach((item) => {
          posMap[item.id] = item;
        });

        const area = canvasEl.width * canvasEl.height;
        const ideal = Math.sqrt(area / nodes.length) * 0.9;
        let temperature = Math.max(canvasEl.width, canvasEl.height) / 6;
        const disp = positions.map(() => ({ x: 0, y: 0 }));

        for (let iter = 0; iter < 260; iter++) {
          disp.forEach((item) => {
            item.x = 0;
            item.y = 0;
          });

          for (let i = 0; i < positions.length; i++) {
            for (let j = i + 1; j < positions.length; j++) {
              const dx = positions[j].x - positions[i].x;
              const dy = positions[j].y - positions[i].y;
              const dist = Math.max(Math.hypot(dx, dy), 0.1);
              const force = (ideal * ideal) / dist;
              const ux = dx / dist;
              const uy = dy / dist;
              disp[i].x -= ux * force;
              disp[i].y -= uy * force;
              disp[j].x += ux * force;
              disp[j].y += uy * force;
            }
          }

          designer.relations.forEach((relation) => {
            const start = relation.state.links && relation.state.links.start && relation.state.links.start.id;
            const end = relation.state.links && relation.state.links.end && relation.state.links.end.id;
            if (!start || !end || !posMap[start] || !posMap[end] || start === end) return;
            const a = posMap[start];
            const b = posMap[end];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.max(Math.hypot(dx, dy), 0.1);
            const force = (dist * dist) / ideal;
            const ux = dx / dist;
            const uy = dy / dist;
            disp[positions.indexOf(a)].x += ux * force;
            disp[positions.indexOf(a)].y += uy * force;
            disp[positions.indexOf(b)].x -= ux * force;
            disp[positions.indexOf(b)].y -= uy * force;
          });

          positions.forEach((item, index) => {
            const len = Math.hypot(disp[index].x, disp[index].y);
            if (!len) return;
            const capped = Math.min(len, temperature);
            item.x += (disp[index].x / len) * capped;
            item.y += (disp[index].y / len) * capped;
          });
          temperature *= 0.97;
        }

        const boxes = nodes.map((node) => boxMap[node.id]);
        resolveOverlaps(positions, boxes);

        positions.forEach((item) => {
          const node = nodeMap[item.id];
          node.entity.setPosition(item.x, item.y);
        });
        routeRelations(null);
        setLinkingMode(false);
        fitViewportToContent();
        refreshHistoryButtons();
      }

      function rel(source, target, props = {}) {
        const sourceBox = source.getMinBoundingBox(true);
        const targetBox = target.getMinBoundingBox(true);
        const sx = sourceBox.center[0];
        const sy = sourceBox.center[1];
        const tx = targetBox.center[0];
        const ty = targetBox.center[1];
        const dx = tx - sx;
        const dy = ty - sy;

        let start = 'R';
        let end = 'L';
        if (Math.abs(dx) > Math.abs(dy)) {
          start = dx >= 0 ? 'R' : 'L';
          end = dx >= 0 ? 'L' : 'R';
        } else {
          start = dy >= 0 ? 'B' : 'T';
          end = dy >= 0 ? 'T' : 'B';
        }

        return makeRelation({
          ...props,
          links: {
            start: { id: source.state.id, position: start },
            end: { id: target.state.id, position: end },
          },
        });
      }

      rel(E.Shipment, E.LogisticsTracking, {
        relationType: 'one-to-many',
        sourceField: 'id',
        targetField: 'shipmentId',
        onDelete: 'CASCADE',
      });

      rel(E.CouponTemplate, E.Coupon, {
        relationType: 'one-to-many',
        sourceField: 'id',
        targetField: 'templateId',
      });
      rel(E.Customer, E.Coupon, {
        relationType: 'one-to-many',
        sourceField: 'id',
        targetField: 'customerId',
      });
      rel(E.Order, E.Coupon, {
        relationType: 'one-to-many',
        sourceField: 'id',
        targetField: 'orderId',
      });
      rel(E.Order, E.Promotion, {
        relationType: 'many-to-many',
        sourceField: 'id',
        targetField: 'id',
        joinTableName: 'order_promotions',
      });

      applyForceLayout();
      designer.select(E.Customer.state.id);
      renderPanel();
    </script>
  </body>
