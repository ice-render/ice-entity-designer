<!DOCTYPE html>

<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>IED · Worker 镜像渲染验证（流程图）</title>
  <!-- 依赖走本地 node_modules/ice-render + ../dist（共享内核，不内联），离线可跑、e2e 可复现。 -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    header {
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
    }
    .hint {
      color: #475569;
      max-width: 1080px;
    }
    .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    button {
      font: inherit;
      padding: 4px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    button[data-active='true'] {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    main {
      display: flex;
      gap: 12px;
      padding: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .pane {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
    }
    .pane h2 {
      font-size: 13px;
      margin: 0 0 6px;
      color: #334155;
    }
    canvas {
      display: block;
      border: 1px solid #cbd5e1;
      background: #fff;
    }
    pre {
      margin: 0 12px 12px;
      padding: 10px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      min-height: 140px;
      overflow: auto;
      font-size: 12px;
    }
  </style>
  <body>
    <header>
      <h1>IED · Worker 镜像渲染验证（真实应用：流程图）</h1>
      <div class="hint">
        同一棵树两种渲染通道：<b>主线程渲染</b>（现状，引擎直接画到可见画布）与
        <b>worker 镜像</b>（主线程只跑几何通道 + 协议，光栅化在 worker，位图回传）。
        可见画布刻意偏离页面左上角，输入/命中在两种模式下都必须正确 —— 命中检测永远在主线程。
      </div>
      <div class="bar">
        <label>节点数 <input id="nodes" type="number" min="4" max="400" value="120" style="width: 70px" /></label>
        <button id="rebuild">重建场景</button>
        <button id="mode-main" data-mode="main">主线程渲染</button>
        <button id="mode-mirror" data-mode="mirror">worker 镜像</button>
        <button id="bench-main">跑基准（主线程）</button>
        <button id="bench-mirror">跑基准（worker 镜像）</button>
        <button id="compare">像素比对</button>
      </div>
    </header>
    <main>
      <div class="pane">
        <h2 id="view-title">可见画布（输入来源 + 当前渲染通道）</h2>
        <canvas id="view" lang="zh-CN" width="900" height="620"></canvas>
      </div>
      <div class="pane">
        <h2>参考：同一份文档的主线程直绘</h2>
        <canvas id="ref" lang="zh-CN" width="900" height="620"></canvas>
      </div>
      <canvas id="probe" width="900" height="620" hidden></canvas>
    </main>
    <pre id="out">准备就绪。</pre>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script type="text/javascript">

      const ICE = window.ICE;
      const IED = window.IED;
      const out = document.getElementById('out');
      const view = document.getElementById('view');
      const probe = document.getElementById('probe');
      const ref = document.getElementById('ref');
      const W = view.width;
      const H = view.height;
      const log = [];

      /**
       * 一页一个类（家族约定）：构造期把实例、DOM、事件一次建好；
       * `bench()` / `compare()` 是给 e2e 用的把手，UI 按钮只是薄薄一层。
       */
      class WorkerMirrorPage {
        constructor() {
          this.mode = 'main';
          this.host = null;
          const params = new URLSearchParams(location.search);
          this.nodeCount = Number(params.get('nodes')) || 120;
          /** `?backend=main` 强制主线程渲染（等价于"这台浏览器没有 worker"）；`?worker=` 换 worker 脚本（可用坏的） */
          this.forceMain = params.get('backend') === 'main';
          /**
           * 直绘模式（`transferControlToOffscreen`）要求显示画布**还没有 2d 上下文**，
           * 而本页把引擎 init 在同一块可见画布上（输入要绑它）—— 所以这里不具备条件。
           * 想用直绘：把显示层与"输入/量测层"拆成两块画布，见引擎参考宿主
           * `ice-render/examples/worker/mirror-render.html` 的 `?direct=1`。
           */
          this.workerUrl = params.get('worker') || 'worker-mirror.worker.js';

          // 主线程：唯一真相（DOM 事件、命中检测、状态都在这里）
          this.ice = new ICE.ICE().init('view', { renderMode: 'full' });
          this.designer = new IED.FlowDesigner(this.ice);

          // 参考渲染：另一台 ICE，同一份文档 + 同一批类型，主线程真实上下文直绘
          this.refIce = new ICE.ICE().init('ref', { renderMode: 'full' });
          IED.registerDesignerTypes(this.refIce);

          this.buildScene(this.nodeCount);
          this.bindUi();
          window.__page = this;
          this.say(`就绪：${this.nodeCount} 个节点 / ${this.ice.childNodes.length} 个顶层组件（默认主线程渲染）`);
        }

        /** 统一的日志出口（一页一个类：辅助方法也收进类里）。 */
        say(line) {
          log.push(line);
          out.textContent = log.slice(-40).join('\n');
        }

        /** 确定性网格场景：不跑随机布局，e2e 与截图可复现。 */
        buildScene(count) {
          this.designer.clear();
          const cols = Math.max(2, Math.ceil(Math.sqrt(count)));
          const kinds = ['process', 'process', 'decision', 'io', 'process', 'terminator'];
          const created = [];
          for (let i = 0; i < count; i++) {
            const kind = kinds[i % kinds.length];
            created.push(
              this.designer.createNode(kind, {
                title: `步骤 ${i + 1}`,
                left: 60 + (i % cols) * 230,
                top: 60 + Math.floor(i / cols) * 150,
                width: 190,
                height: 76,
              })
            );
          }
          for (let i = 1; i < created.length; i++) {
            // 每 3 条给个标签：标签会走文本绘制，正是要看的那部分开销
            this.designer.createEdge({
              sourceId: created[i - 1].state.id,
              targetId: created[i].state.id,
              label: i % 3 === 0 ? '是' : '',
              linkShape: 'visio',
            });
          }
          this.designer.select(null);
          this.dragTarget = created[Math.floor(created.length / 2)];
          this.dragBase = { left: this.dragTarget.state.left, top: this.dragTarget.state.top };
        }

        bindUi() {
          const setMode = (mode) => this.setMode(mode);
          document.getElementById('mode-main').onclick = () => setMode('main');
          document.getElementById('mode-mirror').onclick = () => setMode('mirror');
          document.getElementById('rebuild').onclick = () => {
            this.nodeCount = Math.max(4, Number(document.getElementById('nodes').value) || 120);
            this.buildScene(this.nodeCount);
            this.ice.dirty = true;
            if (this.mode === 'mirror') this.host.bridge.markSceneNeeded();
            this.say(`重建场景：${this.nodeCount} 个节点`);
          };
          document.getElementById('bench-main').onclick = async () => {
            await this.setMode('main');
            const r = await this.bench(120, 20, 'viewport');
            this.say(`主线程渲染（缩放平移）：每帧 p50=${r.p50.toFixed(2)}ms p95=${r.p95.toFixed(2)}ms（${r.frames} 帧）`);
          };
          document.getElementById('bench-mirror').onclick = async () => {
            await this.setMode('mirror');
            const r = await this.bench(120, 20, 'viewport');
            const lat = await this.latency(12);
            this.say(
              `worker 镜像（缩放平移）：主线程每帧 p50=${r.p50.toFixed(2)}ms p95=${r.p95.toFixed(2)}ms；` +
                `worker 渲染 p50=${(this.host.stats ? this.host.stats.renderMs : 0).toFixed(2)}ms；端到端 p50=${lat.p50.toFixed(2)}ms`
            );
          };
          document.getElementById('compare').onclick = async () => {
            const c = await this.compare();
            this.say(`像素比对：差异 ${c.diff}/${c.total}（alphaDiff=${c.alphaDiff}，最大预乘差 ${c.maxPremult}）`);
          };
        }

        /** 切换渲染通道：`main` = 引擎直接画到可见画布；`mirror` = 几何通道 + worker 光栅化。 */
        async setMode(mode) {
          if (mode === this.mode) return this.mode;
          if (mode === 'mirror') {
            if (this.forceMain) {
              this.say('[镜像] ?backend=main —— 强制主线程渲染（用于验证没有 worker 时的形态）。');
              return this.mode;
            }
            if (typeof ICE.MirrorHost !== 'function') {
              this.say('当前加载的 ice-render 没有 MirrorHost（需要含 worker 镜像的版本）——保持主线程渲染。');
              return this.mode;
            }
            // 启动前先探一句：不支持就**根本别接**（引擎内部还会再探一次，这里是为了把原因说清楚）
            const support = ICE.MirrorHost.detect({ canvas: view });
            if (!support.supported) {
              this.say(
                `当前运行时不支持 worker 镜像（缺 ${support.missing.join('、')}）——保持主线程渲染，功能不受影响。`
              );
              return this.mode;
            }
            this.host = new ICE.MirrorHost({
              onStats: (st) => {
                window.__lastWorkerStats = st;
              },
              canvas: view,
              ice: this.ice,
              workerUrl: this.workerUrl,
              // 起不来（worker 404 / 握手超时 / 半路死掉）自动回退主线程渲染，并把原因报出来
              fallback: 'auto',
              onFallback: (info) => {
                this.say(`[镜像回退] ${info.reason}：${info.message}`);
                window.__mirrorFallback = { reason: info.reason, message: info.message, missing: info.support.missing };
                if (this.host) {
                  this.host = null;
                }
                this.mode = 'main';
                document.title = 'IED · 主线程渲染（已回退）';
                for (const el of document.querySelectorAll('button[data-mode]')) {
                  el.dataset.active = String(el.dataset.mode === 'main');
                }
              },
              onBitmap: (bitmap) => {
                // 取像素用的旁路（drawImage 不消耗位图），之后 MirrorHost 再交给 bitmaprenderer
                const pctx = probe.getContext('2d');
                pctx.clearRect(0, 0, W, H);
                pctx.drawImage(bitmap, 0, 0);
                // 帧到达的即时通知：延迟测量**不能靠轮询**（20ms 的轮询粒度会把延迟量成 20ms）
                const waiter = this.__frameWaiter;
                if (waiter) {
                  this.__frameWaiter = null;
                  waiter();
                }
              },
              onEvent: (evt) => {
                if (evt.t === 'error' || evt.t === 'missing') {
                  this.say(`[worker] ${evt.t}${evt.message ? ' ' + evt.message : ''}${evt.ids ? ' ' + evt.ids.join(',') : ''}`);
                }
              },
            });
            this.host.start();
            if (this.host.fallbackReason) {
              // start() 阶段就失败了（探测/构造/握手同步失败）：`onFallback` 已经处理完毕
              return this.mode;
            }
            this.mode = 'mirror';
            document.title = 'IED · worker 镜像';
          } else {
            if (this.host) {
              this.host.stop();
              this.host = null;
            }
            this.mode = 'main';
            document.title = 'IED · 主线程渲染';
          }
          for (const el of document.querySelectorAll('button[data-mode]')) {
            el.dataset.active = String(el.dataset.mode === this.mode);
          }
          document.getElementById('view-title').textContent =
            this.mode === 'mirror' ? '可见画布（worker 位图 + 输入来源）' : '可见画布（主线程直绘 + 输入来源）';
          // 切回主线程后画面要立刻回来
          this.ice.dirty = true;
          this.ice.renderer.frameEvtHandler();
          if (this.mode === 'mirror' && this.host) {
            // 等首帧（**或者**等回退）：worker 起不来时不能把 setMode 卡死在这里
            const outcome = await this.waitFirstFrameOrFallback();
            if (outcome === 'fallback') {
              // `onFallback` 已经把模式切回 main 了，这里只是别让调用方以为"切成功且没画面"
              return this.mode;
            }
          } else {
            await this.nextFrameMainThread();
          }
          return this.mode;
        }

        /** 主线程渲染下"这一帧真的画完了"（切回主线程 / 回退之后用）。 */
        nextFrameMainThread() {
          return new Promise((resolve) => {
            if (typeof requestAnimationFrame === 'function') {
              requestAnimationFrame(() => resolve());
            } else {
              setTimeout(resolve, 16);
            }
          });
        }

        /**
         * 等 `mirror` 模式的**首帧到达**，或等**回退判定**，谁先来算谁。
         *
         * 为什么不能直接用 `waitFrames()`：worker 起不来时它只会一路超时抛错，
         * 把"自动回退"这条正常路径变成异常（真实场景里等于页面卡在切换动作上）。
         */
        async waitFirstFrameOrFallback(timeout = 4000) {
          const t0 = Date.now();
          while (Date.now() - t0 < timeout) {
            if (!this.host || this.host.fallbackReason) {
              return 'fallback';
            }
            if (this.host.frames > 0) {
              return 'frame';
            }
            await new Promise((resolve) => setTimeout(resolve, 20));
          }
          return 'timeout';
        }

        /**
         * 主线程每帧成本基准：一步 = 「改状态 + 让这一帧落地」。
         *
         * 两种模式做的是**同一件逻辑事**；差别只在落墨位置（主画布 vs 几何通道 + 协议）。
         * 因此这个数直接回答"worker 渲染到底给主线程省了多少"。
         */
        async bench(frames = 120, warmup = 20, workload = 'viewport') {
          const step = (i) => {
            if (workload === 'viewport') {
              // 编辑器里最重的一类操作：缩放 + 平移。视口一变，两级缓存（静态层 + 组件位图）
              // 整批失效、所有图元都要按新栅格重画 —— 这正是"worker 光栅化"该省下来的那部分。
              const phase = Math.sin((i / frames) * Math.PI * 2);
              this.ice.setViewport(0.7 + 0.35 * (0.5 + 0.5 * phase), -i * 0.6, -i * 0.35);
            } else {
              // 走**应用自己的 API**（`updateNode`）而不是裸 setState：应用层要负责派生更新
              // （连线按节点新位置重走线），这些派生更新同样是 setState —— 因此也会被镜像。
              // 基准里绕开应用 API 去改裸 state，量到的就不是"真实编辑"的代价。
              this.designer.updateNode(this.dragTarget.state.id, {
                left: this.dragBase.left + (i % 60),
                top: this.dragBase.top + ((i * 7) % 40),
              });
            }
            this.ice.renderer.frameEvtHandler();
            if (this.mode === 'mirror') this.host.frame();
          };
          for (let i = 0; i < warmup; i++) step(i);
          const samples = [];
          for (let i = 0; i < frames; i++) {
            const t0 = performance.now();
            step(warmup + i);
            samples.push(performance.now() - t0);
          }
          samples.sort((a, b) => a - b);
          return {
            mode: this.mode,
            workload,
            frames,
            components: this.ice.renderer.componentQueue.length,
            layerBuilds: (this.ice.renderer && this.ice.renderer.__layerBuilds) || 0,
            p50: samples[Math.floor(samples.length / 2)],
            p95: samples[Math.floor(samples.length * 0.95)],
            min: samples[0],
            max: samples[samples.length - 1],
          };
        }

        /**
         * 端到端延迟：改一次状态 → worker 的位图回到主线程（只有 mirror 模式有意义）。
         *
         * 走**应用自己的 API**（`updateNode`）而不是裸 `setState`：应用层要负责派生更新
         * （连线按节点新位置重新布线），镜像侧重放的是同一条补丁 —— 拿裸 `setState` 量，
         * 量到的既不是真实编辑路径，也会让主线程这边"节点动了、连线没动"，与镜像分叉。
         */
        async latency(samples = 12) {
          if (this.mode !== 'mirror') return { p50: 0, samples: 0 };
          const list = [];
          for (let i = 0; i < samples; i++) {
            const arrived = new Promise((resolve) => {
              this.__frameWaiter = resolve;
            });
            const t0 = performance.now();
            this.designer.updateNode(this.dragTarget.state.id, { left: this.dragBase.left + i * 2 });
            this.host.paint();
            await arrived;
            list.push(performance.now() - t0);
          }
          list.sort((a, b) => a - b);
          return { p50: list[Math.floor(list.length / 2)], p95: list[Math.floor(list.length * 0.95)], samples: list.length };
        }


        /**
         * 要一帧并**等它真的回来**。
         *
         * 必须事件驱动（`__frameWaiter` 由 onBitmap 触发），不能等帧计数：
         * 计数会与"上一帧还在路上"赛跑 —— 拿到旧位图去比新状态，看起来就像"镜像没同步"。
         */
        nextFrame() {
          if (!this.host) return Promise.resolve();
          const arrived = new Promise((resolve) => {
            this.__frameWaiter = resolve;
          });
          this.host.paint();
          return arrived;
        }

        /**
         * **排空在途消息**，取一张"静止状态"的位图。
         *
         * 为什么 `nextFrame()` 不够：它等的是"下一张到达的位图"，而在途位图可能有不止一张
         * （上一步的 frame 与本次 paint 的 frame 同时在路上）—— 先到的那张画的是**上一步**
         * 的状态，读它的 `treeDigest` 就会把"镜像落后一帧"误读成"镜像状态分叉"（实测：每步差
         * 2px 的那类假差异）。
         *
         * 收尾条件是**精确水印**：`frame` 带 `seq`、worker 在 `rendered` 里原样回传
         *（`MirrorBridge.lastFrameSeq` → `host.renderedSeq`），等到"手上这张位图的 seq 已经
         * 追平我们最后发的那一帧"才算排空。用"再等 N 帧"这种猜测会在队列深的时候误判
         *（实测：连等 8 帧仍可能读到旧快照 —— 因为背压之前 worker 那边积压了两百多条 frame）。
         */
        async settle(rounds = 8) {
          if (!this.host) return;
          const bridge = this.host.bridge;
          for (let i = 0; i < 40 && bridge.hasPending(); i++) {
            await this.nextFrame();
          }
          // 再明确要一帧：拿到"比之前所有 frame 都新"的位图（等的是水印，不是帧数）
          for (let i = 0; i < rounds && !this.__frameCaughtUp(); i++) {
            await this.nextFrame();
          }
        }

        /** 手上这张位图，是不是已经把最后发出的那帧画完了。 */
        __frameCaughtUp() {
          const bridge = this.host && this.host.bridge;
          if (!bridge || !this.host) return false;
          return !bridge.hasPending() && this.host.renderedSeq >= bridge.lastFrameSeq;
        }

        /** 等 worker 再送一帧（最多 3s）。 */
        waitFrames(count = 1, since = null) {
          if (!this.host) return Promise.resolve();
          const base = since === null ? this.host.frames : since;
          return new Promise((resolve, reject) => {
            const t0 = Date.now();
            const poll = () => {
              if (this.host && this.host.frames >= base + count) return resolve();
              if (Date.now() - t0 > 3000) return reject(new Error('等 worker 帧超时'));
              setTimeout(poll, 20);
            };
            poll();
          });
        }

        /**
         * 逐像素比对：worker 位图（经 2d probe） vs 参考渲染。
         *
         * 这是**真·应用验证**里最关键的一条：场景里有大量文本（节点标题、连线标签），
         * 文本度量与字形栅格化两边必须一致 —— 否则"worker 渲染"对编辑器就是不可用。
         */
        async compare() {
          // 参考用同一份文档重建 + 同步跑一帧（`fromJSONObject` 会重建整棵树）
          this.refIce.fromJSONObject(this.ice.toJSONObject());
          this.refIce.dirty = true;
          this.refIce.renderer.frameEvtHandler();
          if (this.mode === 'mirror') {
            await this.nextFrame();
          }
          const a = probe.getContext('2d').getImageData(0, 0, W, H).data;
          const b = ref.getContext('2d').getImageData(0, 0, W, H).data;
          let diff = 0;
          let alphaDiff = 0;
          let maxChannel = 0;
          let maxPremult = 0;
          let first = -1;
          const pm = (c, al) => Math.round((c * al) / 255);
          for (let i = 0; i < a.length; i += 4) {
            const aa = a[i + 3];
            const ba = b[i + 3];
            let d = 0;
            for (let k = 0; k < 4; k++) d = Math.max(d, Math.abs(a[i + k] - b[i + k]));
            if (d) {
              diff++;
              if (first < 0) first = i / 4;
            }
            if (aa !== ba) alphaDiff++;
            maxChannel = Math.max(maxChannel, Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]));
            maxPremult = Math.max(
              maxPremult,
              Math.abs(pm(a[i], aa) - pm(b[i], ba)),
              Math.abs(pm(a[i + 1], aa) - pm(b[i + 1], ba)),
              Math.abs(pm(a[i + 2], aa) - pm(b[i + 2], ba)),
              Math.abs(aa - ba)
            );
          }
          return { diff, alphaDiff, maxChannel, maxPremult, firstPixel: first, total: W * H, mode: this.mode };
        }

          /** 墨迹包围盒（调试/比对诊断用）。 */
          inkBox(canvas, w, h) {
            const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
            let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1, n = 0;
            for (let i = 0; i < d.length; i += 4) {
              if (d[i + 3] > 8) {
                const x = (i / 4) % w, y = Math.floor((i / 4) / w);
                n++;
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
            return { n, box: [minX, minY, maxX, maxY] };
          }
        /** 与 worker 同口径的树摘要（带标题节点的世界盒）。 */
        treeDigest() {
          return this.ice.childNodes
            .filter((c) => c.state && c.state.title)
            .map((c) => {
              const b = c.getMinBoundingBox(true).getMinAndMaxPoint();
              const name = (c.constructor && (c.constructor.typeId || c.constructor.name)) || '?';
              let extra = '';
              if (Array.isArray(c.state.startPoint) && Array.isArray(c.state.endPoint)) {
                extra = `:${c.state.startPoint.map((v) => (+v).toFixed(1))}|${c.state.endPoint.map((v) => (+v).toFixed(1))}`;
              }
              return `${String(c.props.id).slice(-6)}:${name}:${b.minX.toFixed(2)},${b.minY.toFixed(2)}${extra}`;
            })
            .sort();
        }

        /**
         * 树对账：镜像里的每个节点，世界盒与连线两端点是不是与主线程**逐项一致**。
         *
         * 这是**像素之外**的硬判据：几何一旦分叉，画面迟早对不上。派生部件（标题 / 角标 /
         * 连线标签）不进文档，但它们由**同一条应用层通路**在两边各自重算（见 `derivedScenario`），
         * 所以这里可以要求严格相等 —— 不一致就是真分叉，不是"容差"。
         */
        async compareTrees() {
          // 对齐到**静止态**再比：镜像是一帧延迟的管线，等"下一张位图"只能保证拿到的那张
          // 不是空跑，不能保证它已经把最后一批补丁画进去了（见 settle 的说明）
          if (this.mode === 'mirror') await this.settle();
          const worker = this.host && this.host.stats ? this.host.stats.treeDigest : null;
          const main = this.treeDigest();
          const mismatch = [];
          const rows = worker || [];
          for (let i = 0; i < main.length; i++) {
            if (rows[i] !== main[i]) mismatch.push(rows[i]);
          }
          return {
            count: main.length,
            workerCount: rows.length,
            mismatchCount: mismatch.length + Math.abs(rows.length - main.length),
            mismatch: mismatch.slice(0, 5),
            equal: mismatch.length === 0 && rows.length === main.length,
          };
        }

        /**
         * e2e / 探针把手：两种模式 × 两类负载各跑一遍，回传可比较的数字。
         *
         * 刻意把 drag（改一个节点，引擎自己的静态层/缓存已经吸收掉了）与
         * viewport（缩放平移，缓存整批失效）分开报 —— 混成一个数只会掩盖结论。
         */
        /**
         * 用**主线程自己画的画面**当参考，比对 worker 位图 —— 参考侧**强制直绘**（关静态层 +
         * 逐组件重画）才是真值；镜像侧比的是"worker 的最后一帧"，那一帧在视口负载之后可能来自
         * **静态层位图合成**（位图是 8bit 预乘存储，来回一次有 ≤2/255 的既定容差）。
         * 所以这条比对的口径是"**覆盖率必须严格一致 + 像素只差在位图容差内**"，而不是逐位 0；
         * 逐位 0 只在**没有位图历史**的场景里成立（见 spec 的 ① 初始态断言）。
         *
         * 与 `compare()` 的区别：`compare()` 的参考是"用同一份文档另建一台 ICE 直绘"，
         * 这里比的是"主线程这台真正的源树直绘"。两者不一样时，说明差异来自**重建过程**
         * （`fromJSONObject` 不会重放应用层的派生逻辑），而不是镜像本身。
         */
        async compareWithMainView() {
          const wasMirror = this.mode === 'mirror';
          if (wasMirror) {
            // 先要一张"当前状态"的镜像帧再切换：否则比的是**上一张**位图（可能来自基准中途的
            // 视口/状态），而主线程那边画的是当前状态 —— 两边根本不是同一时刻，白白看着像"镜像不同步"
            await this.settle();
            await this.setMode('main');
          }
          // 关掉静态层再比：静态层位图是"上一帧粘回去"的优化，像素验收要的是**逐组件重画**的
          // 真值（否则比到的可能是层里的旧内容，而不是这台树现在的样子）
          this.ice.renderer.setStaticLayerEnabled(false);
          this.ice.dirty = true;
          for (const c of this.ice.renderer.componentQueue) c.dirty = true;
          this.ice.renderer.frameEvtHandler();
          const a = probe.getContext('2d').getImageData(0, 0, W, H).data;
          const b = view.getContext('2d').getImageData(0, 0, W, H).data;
          let diff = 0, alphaDiff = 0, maxPremult = 0;
          const pm = (c, al) => Math.round((c * al) / 255);
          for (let i = 0; i < a.length; i += 4) {
            const aa = a[i + 3], ba = b[i + 3];
            let d = 0;
            for (let k = 0; k < 4; k++) d = Math.max(d, Math.abs(a[i + k] - b[i + k]));
            if (d) diff++;
            if (aa !== ba) alphaDiff++;
            maxPremult = Math.max(maxPremult, Math.abs(pm(a[i], aa) - pm(b[i], ba)), Math.abs(aa - ba));
          }
          // 调试用：把"比对那一刻"的两张图画出来（探针/截图排查差异来源）
          window.__lastCompareShots = { worker: probe.toDataURL(), main: view.toDataURL() };
          window.__lastCmpDiag = { probeBox: this.inkBox(probe, W, H), viewBox: this.inkBox(view, W, H), workerStats: this.host ? null : null };
          if (wasMirror) await this.setMode('mirror');
          return { diff, alphaDiff, maxPremult, total: W * H };
        }

        /**
         * **"落墨占比"三档基准**：主线程直绘 / 几何通道（删掉落墨、不启 worker）/ worker 镜像。
         *
         * 为什么要有它：镜像能省的**上界**就是"主线程那一帧里有多少是落墨"——把这三档摆在一条曲线上，
         * "镜像到底还能省多少"就是算出来的，而不是感觉出来的（实测这套场景约 1/3）。
         * 三档必须在**同一个场景、同一套负载**上量：缩放平移（缓存整批失效、全部图元重画的那类）。
         */
        async headroom(frames = 60) {
          const measure = async (setup) => {
            await setup();
            const r = await this.bench(frames, 10, 'viewport');
            return r.p50;
          };
          const main = await measure(async () => {
            await this.setMode('main');
          });
          const mirror = await measure(async () => {
            await this.setMode('mirror');
          });
          const original = this.ice.ctx;
          const geometryOnly = await measure(async () => {
            // 停掉镜像（它会还原落墨通道），然后只把落墨换成几何通道 —— 这就是"镜像是怎么省的"那一档
            if (this.host) {
              this.host.stop();
              this.host = null;
            }
            this.mode = 'main';
            if (!this.__geometryProbeCtx) {
              this.__geometryProbeCtx = ICE.createGeometryOnlyContext(original);
            }
            this.ice.setPaintTarget(this.__geometryProbeCtx);
          });
          // 复位：落墨回到真实画布
          this.ice.setPaintTarget(original);
          this.ice.dirty = true;
          this.ice.renderer.frameEvtHandler();
          await this.waitFrames(1);
          return {
            main: +main.toFixed(3),
            geometryOnly: +geometryOnly.toFixed(3),
            mirror: +mirror.toFixed(3),
            /** 落墨在主线程那一帧里的占比 = 镜像能省的**上界** */
            inkShare: +(1 - geometryOnly / main).toFixed(3),
            /** 镜像实际省了多少 */
            mirrorSave: +(1 - mirror / main).toFixed(3),
          };
        }

        /**
         * **结构通路的镜像往返**：新建节点 + 连线 → 删除它们，回传对账要用的数字。
         *
         * 这是编辑器里最高频的一类编辑（加/删图元）。判据（e2e）：整段场景**不得触发全量重同步**
         * （`appliedScenes` 不变），而几何对账必须仍然逐项一致 —— 也就是说"加/删一个节点"
         * 走的是一条几 KB 的结构增量 op，而不是重发整份文档（200 节点场景 473KB + worker 冷启动重绘）。
         */
        async structureScenario() {
          const scenesBefore = this.host && this.host.stats ? this.host.stats.appliedScenes : 0;
          const addsBefore = this.host && this.host.stats ? this.host.stats.appliedAdds || 0 : 0;
          const removesBefore = this.host && this.host.stats ? this.host.stats.appliedRemoves || 0 : 0;
          const base = this.dragTarget.state;

          const node = this.designer.createNode('process', {
            title: '新建的步骤',
            left: base.left + 40,
            top: base.top + 120,
          });
          const edge = this.designer.createEdge({
            sourceId: base.id,
            targetId: node.state.id,
            linkShape: 'visio',
          });
          await this.settle();
          const afterCreate = await this.compareTrees();

          this.designer.remove(node.state.id); // 连带删掉挂在它上面的连线
          await this.settle();
          const afterDelete = await this.compareTrees();

          return {
            nodeId: node.state.id,
            edgeId: edge.state.id,
            scenesBefore,
            scenesAfter: this.host && this.host.stats ? this.host.stats.appliedScenes : 0,
            adds: (this.host && this.host.stats ? this.host.stats.appliedAdds || 0 : 0) - addsBefore,
            removes: (this.host && this.host.stats ? this.host.stats.appliedRemoves || 0 : 0) - removesBefore,
            afterCreate,
            afterDelete,
          };
        }

        /**
         * **派生通路的镜像往返**：改标题 / 改类型 / 改位置各一次，回传对账要用的数字。
         *
         * 这三步刻意覆盖三条不同的派生通路（也是这一轮修掉的三类分叉）：
         * 1. 改标题：主线程会顺手把**派生部件**（标题文本）也写一次 —— 那个 id 在镜像里不存在
         *    （派生部件不进文档），镜像只能靠"重放容器的补丁"重建它；
         * 2. 改类型：主线程**重建**内部部件（摘旧形状 + 挂新形状，一次真实的结构变更），
         *    镜像侧必须重建自己那份，而不是被当成"结构变了 → 重发整份文档"；
         * 3. 改位置：连线必须跟着重新布线（两侧跑的是同一份 `applyPatch`，见 `FlowNode.applyPatch`）。
         *
         * 判据（e2e）：三步走完，`appliedScenes` 不得增长（没有全量重同步），
         * 而几何对账与像素必须仍然一致。
         */
        async derivedScenario() {
          const id = this.dragTarget.state.id;
          const scenesBefore = this.host && this.host.stats ? this.host.stats.appliedScenes : 0;
          const base = { left: this.dragTarget.state.left, top: this.dragTarget.state.top };
          this.designer.updateNode(id, { title: '改名后的步骤' });
          this.designer.updateNode(id, { kind: 'decision' });
          this.designer.updateNode(id, { left: base.left + 30, top: base.top + 20 });
          await this.settle();
          const trees = await this.compareTrees();
          return {
            id,
            left: this.dragTarget.state.left,
            top: this.dragTarget.state.top,
            skippedDerived: this.host ? this.host.bridge.skippedDerived : 0,
            scenesBefore,
            scenesAfter: this.host && this.host.stats ? this.host.stats.appliedScenes : 0,
            trees,
          };
        }

        async benchBoth(frames = 120) {
          await this.setMode('main');
          const mainViewport = await this.bench(frames, 20, 'viewport');
          const mainDrag = await this.bench(frames, 20, 'drag');
          const sceneBytes = this.ice.toJSONString().length;
          await this.setMode('mirror');
          const mirrorViewport = await this.bench(frames, 20, 'viewport');
          const mirrorDrag = await this.bench(frames, 20, 'drag');
          const latency = await this.latency(12);
          const worker = this.host && this.host.stats ? this.host.stats : null;
          // 把场景还原，便于比对/截图
          this.ice.setViewport(1, 0, 0);
          this.ice.dirty = true;
          this.ice.renderer.frameEvtHandler();
          if (this.mode === 'mirror') {
            await this.nextFrame();
          }
          return { main: { viewport: mainViewport, drag: mainDrag }, mirror: { viewport: mirrorViewport, drag: mirrorDrag }, latency, worker, sceneBytes };
        }

        stats() {
          return {
            mode: this.mode,
            nodes: this.nodeCount,
            components: this.ice.renderer.componentQueue.length,
            frames: this.host ? this.host.frames : 0,
            sent: this.host ? this.host.bridge.sent : 0,
            // 没被镜像过去的写入（主线程改的是"派生部件"，镜像里没有可寻址的对应节点）：
            // 它是**正常的**（容器自己的补丁会让镜像重建那些部件），但必须看得见 —— 数字失控
            // 就说明应用在直接改派生部件、容器状态却没动，那种写法连快照往返也留不下来。
            skippedDerived: this.host ? this.host.bridge.skippedDerived : 0,
            worker: this.host && this.host.stats ? this.host.stats : null,
            sceneBytes: this.ice.toJSONString().length,
          };
        }
      }

      window.__page = new WorkerMirrorPage();
      // 探针把手（e2e 用）
      window.__ready = () => !!(window.__page && window.__page.ice);
      window.__setMode = (mode) => window.__page.setMode(mode);
      window.__bench = (frames) => window.__page.bench(frames || 120);
      window.__benchBoth = (frames) => window.__page.benchBoth(frames || 120);
      window.__compare = () => window.__page.compare();
      window.__compareWithMainView = () => window.__page.compareWithMainView();
      window.__compareTrees = () => window.__page.compareTrees();
      window.__derivedScenario = () => window.__page.derivedScenario();
      window.__structureScenario = () => window.__page.structureScenario();
      window.__headroom = (frames) => window.__page.headroom(frames);
      window.__latency = (n) => window.__page.latency(n || 12);
      window.__stats = () => window.__page.stats();
      window.__log = () => log.slice();
    </script>
  </body>
</html>
