<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>IED-entity-relation</title>
  <body>
    <div>
      <button id="btn-1">保存</button>
      <button id="btn-2">加载</button>
      <button id="btn-3">清除所有</button>
      <script src="../node_modules/ice-render/dist/index.umd.js"></script>
      <script src="../dist/index.umd.js"></script>
    </div>
    <br/>
    <canvas id="canvas-1" width="1024" height="768" style="background-color: #f7f7f7; cursor: grab;"></canvas>
  </body>
  <script type="text/javascript">
      let ice = new ICE.ICE().init('canvas-1');
      window.__ice = ice;
      // 最新内核：按需启用对齐吸附提示线，便于拖拽实体时自动对齐边缘/中心/间距。
      ice.alignmentGuide.enable({ threshold: 6 });

      // 最新内核：简单滚轮缩放 + 中键/空白平移，展示视口能力。
      const canvasEl = document.getElementById('canvas-1');
      canvasEl.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        const oldScale = ice.viewport.scale;
        const nextScale = Math.max(0.3, Math.min(3, oldScale * (evt.deltaY > 0 ? 0.9 : 1.1)));
        const rect = canvasEl.getBoundingClientRect();
        const cx = evt.clientX - rect.left;
        const cy = evt.clientY - rect.top;
        const tx = cx - ((cx - ice.viewport.tx) * nextScale) / oldScale;
        const ty = cy - ((cy - ice.viewport.ty) * nextScale) / oldScale;
        ice.setViewport(nextScale, tx, ty);
      });

      // E-R 场景默认允许拖拽画布：左键在空白处拖拽，中键则始终拖拽；命中图元时仍交给组件拖动逻辑。
      let panning = false;
      let lastX = 0;
      let lastY = 0;
      canvasEl.addEventListener('mousedown', (evt) => {
        const blank = evt.button === 0 && !ice.hitTest(evt.offsetX, evt.offsetY);
        if (evt.button !== 1 && !blank) return;
        evt.preventDefault();
        evt.stopPropagation();
        panning = true;
        lastX = evt.offsetX;
        lastY = evt.offsetY;
        canvasEl.style.cursor = 'grabbing';
      });
      canvasEl.addEventListener('mousemove', (evt) => {
        if (!panning) return;
        const dx = evt.offsetX - lastX;
        const dy = evt.offsetY - lastY;
        lastX = evt.offsetX;
        lastY = evt.offsetY;
        ice.setViewport(ice.viewport.scale, ice.viewport.tx + dx, ice.viewport.ty + dy);
      });
      canvasEl.addEventListener('mouseup', () => {
        panning = false;
        canvasEl.style.cursor = 'grab';
      });
      canvasEl.addEventListener('mouseleave', () => {
        panning = false;
        canvasEl.style.cursor = 'grab';
      });
      canvasEl.addEventListener('auxclick', (evt) => {
        if (evt.button === 1) evt.preventDefault();
      });

      document.querySelector('#btn-1').addEventListener('click', (evt) => {
        const jsonStr = ice.toJSONString();
        console.log(jsonStr);
        window.localStorage.setItem('json-data', jsonStr);

        const erObject=IED.toSchemaObject(ice.childNodes);
        console.log(erObject);
      });
      document.querySelector('#btn-2').addEventListener('click', (evt) => {
        ice.registerType("Entity",IED.Entity);
        ice.registerType("Relation",IED.Relation);

        const jsonStr = window.localStorage.getItem('json-data');
        ice.fromJSONString(jsonStr);
      });
      document.querySelector('#btn-3').addEventListener('click', (evt) => {
        console.log('ice.clearAll()');
        ice.clearAll();
      });

      let entity1=new IED.Entity({
          left:100,
          top: 100,
          width:150,
          height:200,
          showMinBoundingBox: true,
          showMaxBoundingBox: true,
          entityName:'User',
          fields:[
            {
              name:'id',
              type:'number',
              length:64,
              primary: true,
              autoIncrement: true,
              nullable: false,
            },
            {
              name:'userName',
              type:'string',
              length:64,
              unique: true,
              nullable: false,
            },
            {
              name:'password',
              type:'string',
              length:64,
              nullable: false,
            },
            {
              name:'email',
              type:'string',
              length:128,
              nullable: false,
            },
            {
              name:'cellPhone',
              type:'string',
              length:32,
              nullable: true,
              comment: '手机号码，可空',
            }
          ]
        })
        ice.addChild(entity1);

        let entity2=new IED.Entity({
          left:500,
          top: 100,
          width:150,
          height:200,
          showMinBoundingBox: true,
          showMaxBoundingBox: true,
          entityName:'Role',
          fields:[
            {
              name:'id',
              type:'number',
              length:64,
              primary: true,
              autoIncrement: true,
              nullable: false,
            },
            {
              name:'roleName',
              type:'string',
              length:64,
              unique: true,
            },
            {
              name:'roleCode',
              type:'string',
              length:64,
              nullable: false,
            }
          ]
        })
        ice.addChild(entity2);

        let link1=new IED.Relation({
          relationType: 'one-to-many',
          sourceField: 'id',
          targetField: 'id',
          links: {
            start: { id: entity1.state.id, position: 'R' },
            end: { id: entity2.state.id, position: 'L' },
          },
          style: {
            strokeStyle: '#64748b',
            fillStyle: '#334155',
            lineWidth: 2,
          },
          arrow:'end',
        });
        ice.addChild(link1);

        //双击动态修改 entityName 和 fields
        ice.evtBus.on("dblclick",() => {
          console.log("update entity...");
          entity1.setState({
            entityName:"New Name",
            fields:[
              {
                name:'id',
                type:'number',
                length:64,
              }
            ]
          });
        });
  </script>
</html>
