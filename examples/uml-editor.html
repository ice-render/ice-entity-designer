<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>IED-UML-editor</title>
  <style>
    body {
      margin: 0;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #e2e8f0;
      background: #ffffff;
    }
    button,
    select {
      padding: 6px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font: inherit;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: calc(100vh - 53px);
    }
    .canvas-wrap {
      overflow: hidden;
      background: #ffffff;
    }
    canvas {
      display: block;
    }
    aside {
      padding: 12px 14px;
      border-left: 1px solid #e2e8f0;
      background: #ffffff;
      overflow: auto;
    }
    aside h3 {
      margin: 14px 0 6px;
      font-size: 13px;
      color: #64748b;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .row label {
      width: 72px;
      color: #475569;
      font-size: 13px;
    }
    .row input,
    .row select,
    .row textarea {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }
    .row textarea {
      min-height: 64px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .hint {
      color: #64748b;
      font-size: 12px;
    }
    #text-output {
      width: 100%;
      min-height: 220px;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .issue.error {
      color: #b91c1c;
    }
    .issue.warning {
      color: #b45309;
    }
  </style>
  <body>
    <div class="toolbar">
      <button data-add="class">类</button>
      <button data-add="interface">接口</button>
      <button data-add="enum">枚举</button>
      <span class="hint">|</span>
      <button id="btn-delete">删除选中</button>
      <button id="btn-undo">撤销</button>
      <button id="btn-redo">重做</button>
      <span class="hint">|</span>
      <select id="relation-kind" title="关系类型">
        <option value="inheritance">继承（实线空心三角）</option>
        <option value="realization">实现（虚线空心三角）</option>
        <option value="association" selected>关联（实线）</option>
        <option value="aggregation">聚合（空心菱形）</option>
        <option value="composition">组合（实心菱形）</option>
        <option value="dependency">依赖（虚线开放箭头）</option>
      </select>
      <button id="btn-link">连接</button>
      <span class="hint">|</span>
      <button id="btn-fit">适应视图</button>
      <button id="btn-reset">复位视图</button>
      <button id="btn-validate">校验</button>
      <button id="btn-export-svg">导出 SVG</button>
      <button id="btn-export-text">导出 PlantUML</button>
      <button id="btn-import-text">导入 PlantUML</button>
    </div>
    <div class="layout">
      <div class="canvas-wrap">
        <canvas id="canvas-1" width="1600" height="1100"></canvas>
      </div>
      <aside>
        <h3>属性</h3>
        <div id="panel" class="hint">点击画布中的类 / 关系进行编辑</div>
        <h3>UML 校验</h3>
        <div id="validate-output" class="hint">点击「校验」运行语义检查</div>
        <h3>PlantUML / Mermaid 文本</h3>
        <textarea id="text-output" spellcheck="false" placeholder="点「导出 PlantUML」生成，或粘贴文本后点「导入 PlantUML」"></textarea>
      </aside>
    </div>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script src="./canvas-interactions.js"></script>
    <script type="text/javascript">
      /**
       * UML 类图编辑器（示例页）。
       *
       * 页面写法与 flowchart-editor / ice-smart-water 一致：**一页 = 一个类**，构造期把引擎、
       * DOM 引用、交互态与事件一次建好；`onUpdate()` 是**唯一**刷新入口。
       */
      const { ICE, UmlDesigner, UML_RELATION_KINDS } = IED;

      class UmlEditorPage {
        constructor() {
          this.ice = new ICE().init('canvas-1');
          this.designer = new UmlDesigner(this.ice);
          this.canvasEl = document.getElementById('canvas-1');
          this.viewport = IedCanvasViewport.install({ ice: this.ice, canvas: this.canvasEl, designer: this.designer });
          this.ice.alignmentGuide.enable({ threshold: 6 });
          window.__ice = this.ice;
          window.__designer = this.designer;

          this.panel = document.getElementById('panel');
          this.validateOutput = document.getElementById('validate-output');
          this.linking = false;
          this.linkSource = null;

          this.__wireToolbar();
          this.__wireCanvasInteraction();

          // 「构造结束即画好」
          this.buildCase();
          this.onUpdate();
        }

      /* ---------------- 案例：电商支付的类模型 ---------------- */
      buildCase() {
        this.designer.clear();
        const entity = this.designer.createClass({
          kind: 'class',
          className: 'Entity',
          abstract: true,
          attributes: ['# id: string', '# createdAt: Date'],
          methods: ['+ save(): Promise<void>'],
          left: 560,
          top: 70,
          width: 260,
        });
        const user = this.designer.createClass({
          className: 'User',
          attributes: ['- email: string', '- nickname: string'],
          methods: ['+ placeOrder(): Order'],
          left: 240,
          top: 330,
          width: 260,
        });
        const order = this.designer.createClass({
          className: 'Order',
          attributes: ['- id: string', '- total: number', '- status: OrderStatus'],
          methods: ['+ pay(amount: number): void', '+ cancel(): void'],
          left: 620,
          top: 330,
          width: 280,
        });
        const payable = this.designer.createClass({
          kind: 'interface',
          className: 'Payable',
          methods: ['+ pay(amount: number): void'],
          left: 620,
          top: 620,
          width: 280,
        });
        const status = this.designer.createClass({
          kind: 'enum',
          className: 'OrderStatus',
          attributes: ['PENDING', 'PAID', 'CANCELLED'],
          left: 1010,
          top: 600,
          width: 220,
        });
        const item = this.designer.createClass({
          className: 'OrderItem',
          attributes: ['- sku: string', '- quantity: number'],
          left: 1010,
          top: 330,
          width: 260,
        });

        // 继承：User / Order / OrderItem 都继承抽象类 Entity
        // 插槽：子类从顶边上来，父类从底边下去 —— 三条继承线不再挤在 Entity 的同一个角上
        this.designer.createRelation({
          sourceId: user.state.id,
          targetId: entity.state.id,
          relationKind: 'inheritance',
          sourcePort: 'T',
          targetPort: 'B',
        });
        this.designer.createRelation({
          sourceId: order.state.id,
          targetId: entity.state.id,
          relationKind: 'inheritance',
          sourcePort: 'T',
          targetPort: 'B',
        });
        this.designer.createRelation({
          sourceId: item.state.id,
          targetId: entity.state.id,
          relationKind: 'inheritance',
          sourcePort: 'T',
          targetPort: 'B',
        });
        // 实现：Order 实现 Payable 接口
        this.designer.createRelation({
          sourceId: order.state.id,
          targetId: payable.state.id,
          relationKind: 'realization',
          sourcePort: 'B',
          targetPort: 'T',
        });
        // 组合：Order 由 OrderItem 组成（实心菱形在整体一侧）
        this.designer.createRelation({
          sourceId: order.state.id,
          targetId: item.state.id,
          relationKind: 'composition',
          label: '1..*',
        });
        // 关联：User 下订单
        this.designer.createRelation({
          sourceId: user.state.id,
          targetId: order.state.id,
          relationKind: 'association',
          label: '1 : 0..*',
        });
        // 依赖：Order 用到 OrderStatus
        this.designer.createRelation({ sourceId: order.state.id, targetId: status.state.id, relationKind: 'dependency' });

        this.designer.select(null);
        this.designer.fitViewport();
      }

      /* ---------------- 工具栏 ---------------- */
      __wireToolbar() {
      document.querySelectorAll('[data-add]').forEach((button) => {
        button.addEventListener('click', () => {
          this.designer.createClass({ kind: button.dataset.add });
          this.onUpdate();
        });
      });
      document.getElementById('btn-delete').addEventListener('click', () => {
        if (this.designer.selectedId) {
          this.designer.remove(this.designer.selectedId);
          this.onUpdate();
        }
      });
      document.getElementById('btn-undo').addEventListener('click', () => {
        this.designer.undo();
        this.onUpdate();
      });
      document.getElementById('btn-redo').addEventListener('click', () => {
        this.designer.redo();
        this.onUpdate();
      });
      document.getElementById('btn-fit').addEventListener('click', () => this.viewport.fitViewport());
      document.getElementById('btn-reset').addEventListener('click', () => this.viewport.reset());
      document.getElementById('btn-link').addEventListener('click', () => {
        this.linking = !this.linking;
        this.linkSource = null;
        document.getElementById('btn-link').classList.toggle('active', this.linking);
      });
      document.getElementById('btn-validate').addEventListener('click', () => {
        const issues = this.designer.validateUml();
        this.validateOutput.innerHTML = '';
        this.validateOutput.className = issues.length ? '' : 'hint';
        if (!issues.length) {
          this.validateOutput.textContent = '✅ 未发现问题';
          return;
        }
        issues.forEach((issue) => {
          const div = document.createElement('div');
          div.className = `issue ${issue.level}`;
          div.textContent = `${issue.level === 'error' ? '❌' : '⚠️'} ${issue.message}`;
          this.validateOutput.appendChild(div);
        });
      });
      document.getElementById('btn-export-svg').addEventListener('click', () => {
        const svg = this.designer.toSvg({ padding: 16, background: '#ffffff' });
        window.__exportedSvg = svg;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'uml-class-diagram.svg';
        a.click();
        URL.revokeObjectURL(url);
        this.validateOutput.className = 'hint';
        this.validateOutput.textContent = `✅ 已导出 SVG（${svg.length} 字节）`;
      });

      // PlantUML / Mermaid 文本互操作：导出可直接贴进 Wiki/Markdown，导入可搬存量图
      document.getElementById('btn-export-text').addEventListener('click', () => {
        const text = IED.toPlantUml(this.designer, { title: '电商支付类模型' });
        document.getElementById('text-output').value = text;
        window.__exportedText = text;
      });
      document.getElementById('btn-import-text').addEventListener('click', () => {
        try {
          const result = IED.fromPlantUml(document.getElementById('text-output').value, this.designer);
          this.designer.fitViewport();
          this.validateOutput.className = result.warnings.length ? '' : 'hint';
          this.validateOutput.textContent = `✅ 已导入 ${result.classes} 个类 / ${result.relations} 条关系${
            result.warnings.length ? `（${result.warnings.length} 条提示）` : ''
          }`;
        } catch (error) {
          this.validateOutput.className = 'issue error';
          this.validateOutput.textContent = `❌ 导入失败：${error.message}`;
        }
        this.onUpdate();
      });
      }

      /* ---------------- 画布交互：命中 / 拖拽 / 连线 ---------------- */
      __wireCanvasInteraction() {
      this.ice.evtBus.on('mousedown', (evt) => {
        const target = evt.target;
        if (!target) {
          return;
        }
        const domain = this.designer.nodes.concat(this.designer.edges).filter((item) => {
          let node = target;
          while (node) {
            if (node === item) {
              return true;
            }
            node = node.parentNode;
          }
          return false;
        })[0];
        if (!domain) {
          return;
        }
        if (this.linking) {
          if (!this.linkSource) {
            this.linkSource = domain;
          } else if (this.linkSource !== domain) {
            this.designer.createRelation({
              sourceId: this.linkSource.state.id,
              targetId: domain.state.id,
              relationKind: document.getElementById('relation-kind').value,
            });
            this.linkSource = null;
          }
          this.designer.select(domain.state.id);
          this.onUpdate();
          return;
        }
        this.designer.select(domain.state.id);
        this.onUpdate();
      });
      this.ice.evtBus.on('mouseup', () => this.onUpdate());
      }

      /* ---------------- 属性面板 ---------------- */
      row(label, control) {
        const div = document.createElement('div');
        div.className = 'row';
        const span = document.createElement('label');
        span.textContent = label;
        div.appendChild(span);
        div.appendChild(control);
        return div;
      }
      input(value, onChange) {
        const el = document.createElement('input');
        el.value = value;
        el.addEventListener('change', () => onChange(el.value));
        return el;
      }
      textarea(value, onChange) {
        const el = document.createElement('textarea');
        el.value = value.join('\n');
        el.addEventListener('change', () => onChange(el.value.split('\n').filter((line) => line.trim() !== '')));
        return el;
      }
      select(value, options, onChange) {
        const el = document.createElement('select');
        options.forEach(([val, text]) => {
          const option = document.createElement('option');
          option.value = val;
          option.textContent = text;
          if (val === value) {
            option.selected = true;
          }
          el.appendChild(option);
        });
        el.addEventListener('change', () => onChange(el.value));
        return el;
      }

      onUpdate() {
        this.panel.innerHTML = '';
        const selected = this.designer.selected;
        if (!selected) {
          this.panel.className = 'hint';
          this.panel.textContent = '点击画布中的类 / 关系进行编辑';
          return;
        }
        this.panel.className = '';
        if (this.designer.nodes.indexOf(selected) !== -1) {
          const cls = selected;
          this.panel.appendChild(this.row('类名', this.input(cls.state.className, (value) => this.applyAndRender(() => cls.applyPatch({ className: value })))));
          this.panel.appendChild(
            this.row(
              '类型',
              this.select(
                cls.state.kind,
                [
                  ['class', '类'],
                  ['interface', '接口'],
                  ['enum', '枚举'],
                ],
                (value) => this.applyAndRender(() => cls.applyPatch({ kind: value }))
              )
            )
          );
          this.panel.appendChild(this.row('属性', this.textarea(cls.state.attributes, (value) => this.applyAndRender(() => cls.applyPatch({ attributes: value })))));
          this.panel.appendChild(this.row('方法', this.textarea(cls.state.methods, (value) => this.applyAndRender(() => cls.applyPatch({ methods: value })))));
        } else {
          const relation = selected;
          this.panel.appendChild(
            this.row(
              '关系',
              this.select(
                relation.state.relationKind,
                UML_RELATION_KINDS.map((kind) => [kind, this.designer.constructor.describeRelationKind(kind)]),
                (value) => this.applyAndRender(() => relation.applyPatch({ relationKind: value }))
              )
            )
          );
          this.panel.appendChild(this.row('标签', this.input(relation.state.label || '', (value) => this.applyAndRender(() => relation.applyPatch({ label: value })))));
        }
      }

      applyAndRender(action) {
        action();
        this.designer.captureHistory();
        this.onUpdate();
      }

      }

      new UmlEditorPage();
    </script>
  </body>
</html>
