<!DOCTYPE html>

<html lang="en">
  <meta charset="utf-8" />
  <title>IED-Statechart-editor</title>
  <style>
    body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #e2e8f0; background: #fff; }
    button, select { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font: inherit; }
    .layout { display: grid; grid-template-columns: 1fr 300px; height: calc(100vh - 53px); }
    .canvas-wrap { overflow: hidden; background: #fff; }
    canvas { display: block; }
    aside { padding: 12px 14px; border-left: 1px solid #e2e8f0; background: #fff; overflow: auto; }
    aside h3 { margin: 14px 0 6px; font-size: 13px; color: #64748b; }
    .hint { color: #64748b; font-size: 12px; }
    .issue.error { color: #b91c1c; }
    .issue.warning { color: #b45309; }
    #text-output {
      width: 100%;
      min-height: 200px;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
  <body>
    <div class="toolbar">
      <button data-add="initial">初始</button>
      <button data-add="state">状态</button>
      <button data-add="composite">复合状态</button>
      <button data-add="final">终止</button>
      <span class="hint">|</span>
      <button id="btn-delete">删除选中</button>
      <button id="btn-undo">撤销</button>
      <button id="btn-redo">重做</button>
      <span class="hint">|</span>
      <button id="btn-link">连接</button>
      <button id="btn-fit">适应视图</button>
      <button id="btn-reset">复位视图</button>
      <button id="btn-validate">校验</button>
      <button id="btn-export-svg">导出 SVG</button>
      <button id="btn-export-text">导出 PlantUML</button>
      <button id="btn-import-text">导入 PlantUML</button>
    </div>
    <div class="layout">
      <div class="canvas-wrap"><canvas id="canvas-1" width="1600" height="1100"></canvas></div>
      <aside>
        <h3>属性</h3>
        <div id="panel" class="hint">点击画布中的状态 / 转移进行编辑</div>
        <h3>状态机校验</h3>
        <div id="validate-output" class="hint">点击「校验」运行语义检查</div>
        <h3>PlantUML 状态图文本</h3>
        <textarea id="text-output" spellcheck="false" placeholder="点「导出 PlantUML」生成，或粘贴文本后点「导入 PlantUML」"></textarea>
      </aside>
    </div>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script src="./canvas-interactions.js"></script>
    <script type="text/javascript">
      /**
       * 状态机编辑器（示例页）。
       *
       * 页面写法与 flowchart-editor / ice-smart-water 一致：**一页 = 一个类**，构造期把引擎、
       * DOM 引用、交互态与事件一次建好；`onUpdate()` 是**唯一**刷新入口 —— 选中变化 / 拖拽 /
       * 撤销 / 改属性 / 换案例都由它统一重画属性面板。
       */
      const { ICE, StatechartDesigner } = IED;

      class StatechartEditorPage {
        constructor() {
          this.ice = new ICE().init('canvas-1');
          this.designer = new StatechartDesigner(this.ice);
          this.canvasEl = document.getElementById('canvas-1');
          this.viewport = IedCanvasViewport.install({ ice: this.ice, canvas: this.canvasEl, designer: this.designer });
          this.ice.alignmentGuide.enable({ threshold: 6 });
          window.__ice = this.ice;
          window.__designer = this.designer;

          this.panel = document.getElementById('panel');
          this.validateOutput = document.getElementById('validate-output');
          this.linking = false;
          this.linkSource = null;

          this.__wireToolbar();
          this.__wireCanvasInteraction();

          // 「构造结束即画好」
          this.buildCase();
          this.onUpdate();
        }

        /* ---------------- 案例：订单状态机（含复合状态） ---------------- */
        buildCase() {
          this.designer.clear();
          const initial = this.designer.createState({ kind: 'initial', left: 120, top: 120 });
          const pending = this.designer.createState({ title: '待支付', left: 240, top: 100, width: 180, height: 64 });
          const paid = this.designer.createState({ title: '已支付', left: 620, top: 100, width: 180, height: 64 });
          const done = this.designer.createState({ kind: 'final', left: 1010, top: 120 });
          const composite = this.designer.createState({ kind: 'composite', title: '订单处理', left: 560, top: 300, width: 520, height: 280 });
          const checking = this.designer.createState({ title: '库存校验', left: 620, top: 380, width: 160, height: 60 });
          const shipping = this.designer.createState({ title: '安排发货', left: 850, top: 380, width: 160, height: 60 });
          const canceled = this.designer.createState({ title: '已取消', left: 220, top: 400, width: 180, height: 64 });

          this.designer.createTransition({ sourceId: initial.state.id, targetId: pending.state.id });
          this.designer.createTransition({
            sourceId: pending.state.id,
            targetId: paid.state.id,
            event: '支付成功',
            guard: '金额 > 0',
            action: '生成订单',
          });
          this.designer.createTransition({ sourceId: pending.state.id, targetId: canceled.state.id, event: '超时未支付' });
          this.designer.createTransition({ sourceId: paid.state.id, targetId: checking.state.id, event: '进入处理' });
          this.designer.createTransition({ sourceId: checking.state.id, targetId: shipping.state.id, event: '库存充足' });
          this.designer.createTransition({ sourceId: checking.state.id, targetId: canceled.state.id, event: '缺货' });
          this.designer.createTransition({ sourceId: shipping.state.id, targetId: done.state.id, event: '已发货' });

          this.designer.select(null);
          this.designer.fitViewport();
        }

        /* ---------------- 工具栏 ---------------- */
        __wireToolbar() {
          document.querySelectorAll('[data-add]').forEach((button) => {
            button.addEventListener('click', () => {
              this.designer.createState({ kind: button.dataset.add });
              this.onUpdate();
            });
          });
          document.getElementById('btn-delete').addEventListener('click', () => {
            if (this.designer.selectedId) {
              this.designer.remove(this.designer.selectedId);
              this.onUpdate();
            }
          });
          document.getElementById('btn-undo').addEventListener('click', () => {
            this.designer.undo();
            this.onUpdate();
          });
          document.getElementById('btn-redo').addEventListener('click', () => {
            this.designer.redo();
            this.onUpdate();
          });
          document.getElementById('btn-fit').addEventListener('click', () => this.viewport.fitViewport());
          document.getElementById('btn-reset').addEventListener('click', () => this.viewport.reset());
          document.getElementById('btn-link').addEventListener('click', () => {
            this.linking = !this.linking;
            this.linkSource = null;
            document.getElementById('btn-link').classList.toggle('active', this.linking);
          });
          document.getElementById('btn-validate').addEventListener('click', () => {
            const issues = this.designer.validateStatechart();
            this.validateOutput.innerHTML = '';
            this.validateOutput.className = issues.length ? '' : 'hint';
            if (!issues.length) {
              this.validateOutput.textContent = '✅ 未发现问题';
              return;
            }
            issues.forEach((issue) => {
              const div = document.createElement('div');
              div.className = `issue ${issue.level}`;
              div.textContent = `${issue.level === 'error' ? '❌' : '⚠️'} ${issue.message}`;
              this.validateOutput.appendChild(div);
            });
          });
          document.getElementById('btn-export-svg').addEventListener('click', () => {
            const svg = this.designer.toSvg({ padding: 16, background: '#ffffff' });
            window.__exportedSvg = svg;
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'order-statechart.svg';
            a.click();
            URL.revokeObjectURL(url);
            this.validateOutput.className = 'hint';
            this.validateOutput.textContent = `✅ 已导出 SVG（${svg.length} 字节）`;
          });

          // PlantUML 状态图文本互操作：导出可直接贴进 Wiki/Markdown，导入可搬存量图
          document.getElementById('btn-export-text').addEventListener('click', () => {
            const text = IED.toPlantUmlState(this.designer, { title: '订单状态机' });
            document.getElementById('text-output').value = text;
            window.__exportedText = text;
          });
          document.getElementById('btn-import-text').addEventListener('click', () => {
            try {
              const result = IED.fromPlantUmlState(document.getElementById('text-output').value, this.designer);
              this.designer.fitViewport();
              this.validateOutput.className = result.warnings.length ? '' : 'hint';
              this.validateOutput.textContent = `✅ 已导入 ${result.states} 个状态 / ${result.transitions} 条转移${
                result.warnings.length ? `（${result.warnings.length} 条提示）` : ''
              }`;
            } catch (error) {
              this.validateOutput.className = 'issue error';
              this.validateOutput.textContent = `❌ 导入失败：${error.message}`;
            }
            this.onUpdate();
          });
        }

        /* ---------------- 画布交互：命中 / 连线 ---------------- */
        __wireCanvasInteraction() {
          this.ice.evtBus.on('mousedown', (evt) => {
            const target = evt.target;
            if (!target) {
              return;
            }
            const domain = this.designer.nodes
              .concat(this.designer.edges)
              .filter((item) => {
                let node = target;
                while (node) {
                  if (node === item) {
                    return true;
                  }
                  node = node.parentNode;
                }
                return false;
              })[0];
            if (!domain) {
              return;
            }
            if (this.linking) {
              if (!this.linkSource) {
                this.linkSource = domain;
              } else if (this.linkSource !== domain) {
                this.designer.createTransition({ sourceId: this.linkSource.state.id, targetId: domain.state.id, event: '事件' });
                this.linkSource = null;
              }
              this.designer.select(domain.state.id);
              this.onUpdate();
              return;
            }
            this.designer.select(domain.state.id);
            this.onUpdate();
          });
          this.ice.evtBus.on('mouseup', () => this.onUpdate());
        }

        /* ---------------- 属性面板 ---------------- */
        row(label, control) {
          const div = document.createElement('div');
          div.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px';
          const span = document.createElement('label');
          span.textContent = label;
          span.style.cssText = 'width:64px;color:#475569;font-size:13px';
          div.appendChild(span);
          div.appendChild(control);
          return div;
        }

        input(value, onChange) {
          const el = document.createElement('input');
          el.value = value;
          el.style.cssText = 'flex:1;padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font:inherit';
          el.addEventListener('change', () => onChange(el.value));
          return el;
        }

        applyAndRender(action) {
          action();
          this.designer.captureHistory();
          this.onUpdate();
        }

        /** 唯一刷新入口：按当前选中对象重画面板。 */
        onUpdate() {
          this.panel.innerHTML = '';
          const selected = this.designer.selected;
          if (!selected) {
            this.panel.className = 'hint';
            this.panel.textContent = '点击画布中的状态 / 转移进行编辑';
            return;
          }
          this.panel.className = '';
          if (this.designer.nodes.indexOf(selected) !== -1) {
            if (selected.isPseudoState()) {
              this.panel.textContent = selected.state.kind === 'initial' ? '初始伪状态（无属性）' : '终止伪状态（无属性）';
              return;
            }
            this.panel.appendChild(
              this.row('名称', this.input(selected.state.title, (value) => this.applyAndRender(() => selected.applyPatch({ title: value }))))
            );
            return;
          }
          this.panel.appendChild(
            this.row('事件', this.input(selected.state.event || '', (value) => this.applyAndRender(() => selected.applyPatch({ event: value }))))
          );
          this.panel.appendChild(
            this.row('守卫', this.input(selected.state.guard || '', (value) => this.applyAndRender(() => selected.applyPatch({ guard: value }))))
          );
          this.panel.appendChild(
            this.row('动作', this.input(selected.state.action || '', (value) => this.applyAndRender(() => selected.applyPatch({ action: value }))))
          );
        }
      }

      new StatechartEditorPage();
    </script>
  </body>
</html>
